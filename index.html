# 09 - Runbook: Operations

Keeping the kit healthy during a mission: what to watch, routine checks, common failures,
and how the kit behaves (and what you do) when a node is lost. Field conditions - power,
heat, bumps - make hardware failure the expected case, not the exception.

## Daily operational checks

Run each operational period (start of shift):

1. **Monitoring console** - open the MC on `mgmt01`; confirm all instances green, no
   skipped searches, no indexing latency alerts, no missing cluster peers.
2. **Cluster status** (M/L): `splunk show cluster-status` on the CM - all peers up, RF and
   SF met, no buckets fixing for long.
3. **Ingest flowing** - per source:
   ```spl
   index=* earliest=-15m | stats count latest(_time) as last_seen by index, sourcetype
   ```
   Any expected source with `count=0` or a stale `last_seen` is investigated.
4. **Disk headroom** - on every indexer, data volume < 80% used.
5. **Time** - `chronyc tracking` within tolerance everywhere.
6. **Power** - UPS load and runtime nominal; no host on battery unexpectedly.
7. **Firewall** - review deny log for unexpected site traffic.

## Key health searches

```spl
# Indexing latency (event time vs index time)
index=_internal source=*metrics.log group=per_index_thruput
| eval latency = _indextime - _time | stats avg(latency) max(latency) by series

# Forwarder connectivity
| rest /services/deployment/server/clients | table hostname, utsname, lastPhoneHomeTime

# Skipped/queued searches (search head pressure)
index=_internal sourcetype=scheduler status=skipped
| stats count by savedsearch_name
```

## Common failures

| Symptom | Likely cause | Action |
|---------|-------------|--------|
| Source shows `count=0` | Site FW rule missing, wrong index/sourcetype, UF not phoning home | Check [13](13-site-integration.md) FW rules; check DS serverclass; check `outputs.conf` |
| Indexing latency rising | Indexer CPU/disk saturated, or a single hot source | Spread load; check [sizing](01-architecture.md#sizing-math); throttle noisy source |
| Cluster "buckets fixing" | A peer restarted/returned | Normal short-term; if persistent, check peer disk/health |
| MC shows peer missing | Host down, network, or splunkd stopped | Ping/SSH; `systemctl status Splunkd`; check switch port |
| HEC 401/403 | Bad/disabled token | Reissue token; confirm `enableSSL` and port 8088 open |
| SC4S not ingesting | Container down, device not pointed at it, FW | `podman ps`; confirm device syslog target; check 514/6514 |
| Time skew | chrony lost source / drift | `chronyc sources`; re-point to kit NTP/GPS |
| Disk nearly full | Retention too long for volume | Lower `frozenTimePeriodInSecs` or roll to frozen/export; see teardown |
| License warning | Volume over daily quota / license near expiry | Check LM; reduce ingest or acknowledge; expiry is a pack-time check |

## Degraded-mode operation

### Losing an indexer

- **Clustered (M/L, RF=2/SF=2):** the cluster tolerates **one** indexer loss with no data
  loss and full searchability. The CM re-replicates buckets to restore RF/SF using the
  survivors' headroom. Actions: confirm in `cluster-status` that fix-up is progressing;
  watch disk on survivors (re-replication consumes space); bring up the cold-spare
  indexer and join it to the cluster to restore full capacity. Losing a **second** indexer
  before fix-up completes risks data loss - prioritize the spare.
- **Standalone (Small):** that indexer's data is **unavailable** until restored; new data
  routes to the surviving indexer if outputs list both. There is no automatic recovery -
  this is the accepted trade for the Small tier's size. If survivability matters, deploy
  Medium.

### Losing a search head

- **ES SHC (Large):** 3 members tolerate one loss; the captain re-elects automatically.
  Analysts keep working via another member. Rejoin or replace the member.
- **Single ES SH (S/M):** searching/ES is down until restored, but **ingestion and
  indexing continue** - no data is lost, only analyst access. Restore from the host's
  config (kept on offline media) or rebuild the SH and re-add peers.

### Losing the management node

- **LM down:** peers enter the license grace period and keep running; restore the LM
  before the grace window closes.
- **CM down (M/L):** the cluster keeps indexing and searching existing buckets, but
  bucket fix-up and new-peer joins pause until the CM returns. Restore promptly; do not
  make cluster changes while it is down.
- **DS down:** forwarders keep running with their current apps; only new app pushes pause.
- Because management roles are colocated on `mgmt` laptops (which have battery), a power
  blip rarely takes them down - but keep their configs on offline media for fast rebuild.

### Power loss

Laptops ride through on battery. Desktops (indexers, SOAR, AI) depend on the UPS for a
clean shutdown - if the UPS signals low battery, shut down indexers gracefully
(`splunk stop`) to avoid bucket corruption. On power return, hosts auto-start Splunk
(systemd boot-start) and the cluster self-heals; verify via Phase 6 validation
([08](08-runbook-deploy.md#phase-6--validation)).

## Routine maintenance

- Watch indexer disk daily; adjust retention (`frozenTimePeriodInSecs`) before volumes
  fill rather than after.
- Keep an eye on skipped searches on the ES SH; disable unused accelerated data models.
- Back up critical config (CM bundle, ES config, SOAR playbooks) to the offline media
  periodically so a host rebuild is fast.
- If connected, apply only pinned, checksummed patches per the connected-mode policy
  ([06](06-offline-repo.md#connected-mode-policy)).

</script>

# 10 - Runbook: Teardown

End-of-mission procedure: get the data out, hand off evidence, securely wipe, repack, and
write the post-mission report. Teardown is where data is most at risk of being lost or
leaked - work it as deliberately as deployment.

## Order of operations

1. Stop ingest.
2. Export / preserve required data.
3. Hand off (evidence / deliverables).
4. Secure wipe.
5. Repack and inventory.
6. Post-mission report.

Do not skip to wipe before export and a verified handoff. Confirm with the mission owner
that the handoff is complete and acknowledged before any destructive step.

## Phase 1 - Stop ingest

1. Disconnect the site VLAN first so no new org data enters while you finalize.
2. Stop site-facing inputs (HF/HEC/SC4S) and remote replication
   ([14](14-remote-replication-vpn.md)).
3. Let in-flight data drain to the indexers; confirm indexing latency returns to zero in
   the MC.

## Phase 2 - Export / preserve

Pick the method the mission requires:

- **Raw export (SPL):** export result sets or raw events for specific indexes/time ranges:
  ```spl
  index=mission_* earliest=0 latest=now | ...        # dump to CSV/JSON via UI export or
  ```
  or use `| outputcsv` / the REST export endpoint for scripted dumps.
- **Bucket-level preservation (full fidelity):** copy the index buckets
  (`$SPLUNK_DB/<index>/db|colddb`) for the mission indexes to the evidence drive. This
  preserves raw + tsidx so the data can be re-ingested later for full search fidelity.
- **Frozen archive:** roll relevant buckets to frozen and copy the frozen archive.
- **Remote mirror (if used):** confirm the remote DC/cloud copy is complete and verified
  ([14](14-remote-replication-vpn.md)) before wiping the local copy.

Checksum everything you export (`sha256sum`) and record the hashes in the report.

## Phase 3 - Handoff (evidence / deliverables)

For IR missions, chain of custody is mandatory (see
[11-security.md](11-security.md#data-handling-and-chain-of-custody)):

- Record each exported artifact: index, time range, sha256, size, who exported it, when,
  and the source kit host.
- Transfer on an **encrypted** evidence drive; record who received it, when, and their
  acknowledgement.
- Keep the chain-of-custody form with the artifact; a copy goes in the mission report.
- Do not wipe the kit until the recipient confirms the handoff is readable and complete.

## Phase 4 - Secure wipe

After a verified handoff, sanitize per the mission's data classification
([11](11-security.md#data-classification)).

- **Stop Splunk** on all hosts (`splunk stop`), then **stop SOAR**.
- **Crypto-erase / secure-erase the data NVMe** (indexer data volumes, SOAR
  `/opt/phantom`, SOAR PostgreSQL, SC4S spool, any export staging). If full-disk
  encryption was used ([11](11-security.md)), destroying the key (crypto-erase) plus an
  `nvme format`/`blkdiscard` is the fast, reliable path for NVMe; follow the mission's
  sanitization standard (e.g. NIST 800-88 purge) for the required method and verification.
- **Wipe network gear config** - reset the firewall and switch to a known clean baseline
  so no site topology, VPN keys, or rules leak to the next mission.
- **Rotate secrets** that were in use (cluster `pass4SymmKey`, HEC tokens, VPN keys,
  admin passwords) so a captured artifact can't unlock a future deployment
  ([11](11-security.md)).
- Record the wipe method and verification per device in the report.

> The OS disk layout keeps data on a separate volume
> ([04](04-os-baseline.md#disk-layout)) specifically so this wipe targets the data volume
> cleanly. Re-image OS volumes at base, not in the field, unless the classification
> requires in-field OS wipe too.

## Phase 5 - Repack and inventory

1. Power down in reverse order (hosts, then firewall, then switch, then UPS).
2. Inventory every item against the BOM ([02](02-hardware-bom.md)); note anything damaged,
   failed, or consumed (spares used).
3. Re-verify the **offline media** still passes `sha256sum -c` for the next mission, or
   flag it for refresh at base.
4. Repack to the foam layout; cables coiled and labeled.

## Phase 6 - Post-mission report

Capture while fresh:

- Tier deployed, actual deploy time vs target, headcount.
- Data sources onboarded and volumes seen (from the MC).
- Failures/degraded events and how they were handled ([09](09-runbook-operations.md)).
- Exports produced: artifacts, checksums, handoff acknowledgements.
- Wipe/sanitization record per device.
- Hardware issues, spares used, and resupply needed.
- Lessons learned / changes to feed back into these docs and the kit manifest.

A printable teardown checklist is in
[appendix-checklists.md](appendix-checklists.md#teardown).

</script>
<script type="text/markdown" data-id="11-security" data-title="11 - Security &amp; Data Handling" data-group="Operate" data-file="docs/11-security.md">
# 11 - Security and Data Handling

The kit holds and transports potentially sensitive data on portable hardware into
uncontrolled environments. This document covers host and Splunk hardening, TLS, secrets
and VPN key handling, physical security, data classification, and chain of custody.

## Threat model (brief)

- **Loss or theft** of a laptop/desktop/drive in transit or on site -> full-disk
  encryption and secure wipe are mandatory.
- **Hostile / untrusted site network** -> the kit integrates through a firewall with
  default-deny; it does not trust the org LAN.
- **Data leakage between missions** -> teardown wipe and secret rotation prevent one
  mission's data or keys from surviving into the next.
- **Tampered media/supply** -> checksum/manifest discipline
  ([06](06-offline-repo.md#integrity-self-check)).

## Host hardening

Builds on [04-os-baseline.md](04-os-baseline.md):

- **Full-disk encryption** (LUKS) on every host, especially data volumes. Keys are not
  stored on the same device; use a passphrase or an externally-carried key. Crypto-erase
  at teardown destroys the key ([10](10-runbook-teardown.md#phase-4--secure-wipe)).
- **SELinux enforcing**, **firewalld default-deny** per host, minimal package set.
- Per-operator OS accounts; no shared logins; `sudo` logged and forwarded to Splunk
  (`_audit`/`index=os`).
- Disable USB mass storage auto-mount except the designated media/evidence drives.
- BIOS/UEFI password and Secure Boot where supported.

## Splunk hardening

- **Change all default credentials** on first boot; no `changeme`/`admin:changeme`
  survives Phase 3 of deploy.
- **TLS everywhere** - Splunk Web (8000), splunkd/REST (8089), forwarder-to-indexer
  (9997), HEC (8088), and inter-node management. Carry a kit CA on the offline media and
  issue per-host certs; distribute the CA so clients validate. Avoid shipping the default
  self-signed certs into production use.
- **Role-based access** on the ES SH: analysts get analyst roles, not admin. Limit who
  can touch the MC/CM/LM to admins ([Splunk guidance](https://help.splunk.com/en/splunk-enterprise/administer/monitor/10.6/configure-the-monitoring-console/which-instance-should-host-the-console)).
- **pass4SymmKey** secrets (indexer cluster, SHC) are strong and unique per kit build,
  stored only in `server.conf` (which lives on encrypted disk) and in the sealed secrets
  record - never in this repo.
- **HEC tokens** are generated at deploy, scoped to the minimum index/sourcetype, and
  rotated at teardown. No tokens committed anywhere in plaintext.
- Forward Splunk's own `_internal`/`_audit` so the kit audits itself.

## TLS and secrets inventory

Track every secret the kit uses so rotation at teardown is complete:

| Secret | Where | Rotate at teardown? |
|--------|-------|---------------------|
| Full-disk encryption keys | Externally carried / passphrase | Yes (crypto-erase) |
| Splunk admin passwords | Each instance | Yes |
| Indexer cluster `pass4SymmKey` | CM + peers `server.conf` | Yes |
| SHC `pass4SymmKey` | ES SHC members | Yes |
| HEC tokens | HF/indexer inputs | Yes |
| Kit CA + host private keys | mgmt / each host | Yes (reissue per build) |
| VPN keys (IPsec PSK/certs, WireGuard keys) | Firewall / Headscale | Yes |
| SOAR admin + DB creds | SOAR host | Yes |
| Firewall/switch admin creds | Network gear | Yes |

Keep a sealed, encrypted **secrets record** per mission (not in this repo). It is the
authoritative list the teardown rotation step works from.

## VPN key handling

For remote replication ([14](14-remote-replication-vpn.md)):

- **IPsec:** prefer certificate auth over a pre-shared key; if PSK, make it long and
  unique per mission. Store on the firewall only.
- **Headscale/WireGuard:** each node has its own keypair; the Headscale control server
  holds node keys and ACLs. Pre-authvkeys are short-lived and single-use. Revoke nodes in
  Headscale at teardown and rotate the control server's keys.
- Treat the remote peer config as sensitive: it reveals the remote DC/cloud topology.
  Wipe it from the firewall at teardown.

## Physical security

- Cases locked (and tamper-evident sealed for IR/evidence missions).
- Hosts and drives inventoried by serial/asset tag ([02](02-hardware-bom.md)); the
  inventory is checked at pack and at repack.
- Evidence drives handled under chain of custody (below), stored separately from the
  compute cases.
- Never leave an unlocked, logged-in analyst session unattended on site.

## Data classification

Classify mission data on arrival; it drives retention, export, and wipe method:

| Class | Examples | Handling |
|-------|----------|----------|
| Public / demo | Training data, synthetic | Standard wipe at teardown |
| Internal | Operational logs, non-PII telemetry | Encrypted at rest + standard secure wipe |
| Sensitive / PII | User data, customer logs | Encrypted; restricted access; purge-level wipe; documented export only |
| Evidence | IR artifacts for legal/forensic use | Chain of custody; full-fidelity preservation; purge-level wipe after verified handoff |

## Data handling and chain of custody

For incident-response missions, treat captured data as potential evidence from the moment
of collection:

- Record collection: source, index, time range, who collected, when, and the kit host.
- Preserve integrity: checksum (sha256) artifacts at export; prefer bucket-level or frozen
  preservation for full fidelity ([10](10-runbook-teardown.md#phase-2--export--preserve)).
- Document every transfer/handoff with recipient, time, and acknowledgement on the
  chain-of-custody form.
- Minimize copies; track every copy; destroy working copies at teardown after the
  authoritative handoff is verified.
- Keep the chain-of-custody form with the artifact and in the post-mission report.

> This is operational guidance, not legal advice. For evidence that may be
> used in legal proceedings, follow the organization's and jurisdiction's forensic
> standards; they override anything here.

## Connected-mode caution

Going online expands the attack surface. Every egress is through the firewall with an
explicit, logged allow rule; nothing bypasses the checksum/manifest discipline
([06](06-offline-repo.md#connected-mode-policy)). Meraki-managed gear's cloud dependency
is itself a connected-mode decision and must not be used on air-gapped or sensitive
missions.

</script>
<script type="text/markdown" data-id="12-mission-profiles" data-title="12 - Mission Profiles" data-group="Operate" data-file="docs/12-mission-profiles.md">
# 12 - Mission Profiles

The kit is general-purpose. A mission profile is a preset - which tier, which apps/TAs,
which indexes, and which operational emphasis - so the team loads the right content for
the job instead of improvising on site. Profiles are additive on top of the kit base app.

| Profile | Default tier | Emphasis |
|---------|-------------|----------|
| [Incident response / DFIR](#incident-response--dfir) | Medium | Fast collection, evidence integrity, ES correlation, SOAR |
| [Tactical / disconnected ops](#tactical--disconnected-operations) | Small-Medium | Air-gap, resilience, low power/weight |
| [Demo / training / workshop](#demo--training--workshop) | Small | Self-contained, repeatable, disposable data |

## Incident response / DFIR

**Goal:** stand up collection and analysis at a compromised or at-risk site quickly, with
evidence handled defensibly.

- **Tier:** Medium (cluster survives one indexer loss; ES + SOAR). Large if volume/
  retention demand it.
- **Indexes:** `mission_wineventlog`, `mission_sysmon`, `mission_edr`, `mission_firewall`,
  `mission_proxy`, `mission_dns`, `mission_auth`, plus a catch-all `mission_misc`.
- **Apps / TAs:** Enterprise Security; Splunk_TA_windows, Splunk_TA_microsoft_sysmon,
  Splunk_TA_nix, the relevant EDR and firewall TAs; SOAR with IR playbooks.
- **Ingestion:** UFs to live endpoints via the DS; HF for API sources (EDR/cloud); SC4S
  for network/security device syslog; one-shot file upload / `oneshot` for collected
  artifacts (triage images, exported logs).
- **Emphasis:** chain of custody from first collection
  ([11](11-security.md#data-handling-and-chain-of-custody)); full-fidelity preservation at
  export ([10](10-runbook-teardown.md#phase-2--export--preserve)); ES notables -> SOAR for
  repeatable response; tight RBAC so analysts can't alter evidence indexes.
- **Teardown:** purge-level wipe after verified evidence handoff; rotate all secrets.

## Tactical / disconnected operations

**Goal:** monitoring where connectivity is poor or absent (field, disaster response,
exercise), with resilience and minimal logistics.

- **Tier:** Small or Medium depending on volume. Favor Medium's cluster if a node loss is
  likely and data must survive.
- **Indexes:** mission-specific - sensor/telemetry, comms logs, local infra, `mission_misc`.
- **Apps / TAs:** only what the mission needs - keep the footprint small to save indexer
  CPU and power. Dashboards for the specific watch; alerting tuned for an operator, not a
  SOC.
- **Ingestion:** mostly UF and SC4S from local systems; HEC for any local apps. Assume no
  internet - everything comes off the offline media
  ([06](06-offline-repo.md)).
- **Emphasis:** air-gapped operation is the default; chrony/GPS time discipline for long
  deployments ([03](03-network-design.md#kit-services-dns-dhcp-ntp)); power/weight economy
  ([02](02-hardware-bom.md)); degraded-mode drills so one person can keep it running
  ([09](09-runbook-operations.md#degraded-mode-operation)).
- **Optional:** remote replication to a home DC/cloud **only if** an intermittent link
  exists, using low-bandwidth scheduled export ([14](14-remote-replication-vpn.md)).

## Demo / training / workshop

**Goal:** a self-contained teaching or proof-of-value environment that sets up fast and
resets cleanly.

- **Tier:** Small (single analyst view; cluster not required).
- **Indexes:** `demo_*` with pre-canned or synthetic data; short retention.
- **Apps / TAs:** ES and a couple of representative TAs to show CIM/correlation; sample
  dashboards; optionally SOAR to demo playbooks.
- **Ingestion:** mostly pre-loaded sample data plus a live HEC/UF demo source.
- **Emphasis:** repeatability (same build every time from the manifest), a fast reset
  (re-load sample data, no evidence handling), and disposable data (standard wipe).
- **Connectivity:** either mode; demos are a fine place to exercise connected-mode
  features (Meraki dashboard, remote replication) without evidence risk.

## Choosing and loading a profile

1. Pick the profile and confirm the tier against expected daily volume and retention
   ([01 sizing](01-architecture.md#sizing-math)).
2. Ensure the profile's apps/TAs and sample data are on the offline media and in the
   manifest ([06](06-offline-repo.md)).
3. Create the profile's indexes (cluster bundle on M/L) and DS serverclasses mapping each
   data source to its TA ([05](05-splunk-deployment.md)).
4. Use the Flyaway Kit app concept ([15](15-flyaway-kit-app-concept.md)) to check off the
   site's actual sources and confirm each required TA/UF is configured and reporting.

> Profiles are presets, not hard limits. The general-purpose kit can mix elements (e.g. an
> IR mission that also needs tactical air-gap discipline).

</script>
<script type="text/markdown" data-id="13-site-integration" data-title="13 - Site Integration" data-group="Connect" data-file="docs/13-site-integration.md">
# 13 - Site Integration

How the kit connects to the host organization's network and starts ingesting its data.
The deploying team rarely knows the site in advance, so this document gives the connection
models, a questionnaire to capture what they need to learn, the ingestion-path decision,
and the exact firewall rules the org must open for each path.

Do this only **after** the kit passes internal validation
([08 Phase 6](08-runbook-deploy.md#phase-6--validation)). Stand the kit up on its own LAN
first, then integrate.

## Connection models

Pick one based on the site's trust posture and what the org will allow.

```mermaid
flowchart LR
    subgraph org [Org Network]
        osrc[Sources]
    end
    subgraph kit [Flyaway Kit]
        k[Indexers / SH]
    end
    osrc -->|"A: via firewall"| fwA[KitFirewall] --> k
    osrc -->|"B: via dual-homed HF"| hf[HeavyForwarder] --> k
    osrc -.->|"C: SPAN/TAP passive"| tap[TapToSC4S] --> k
```

| Model | How | Use when | Trade-off |
|-------|-----|----------|-----------|
| **A - Firewall uplink** | Kit firewall's site interface joins an org VLAN (routed or NAT); sources send to kit ingest through allow rules | Org can route traffic to the kit and will open rules | Cleanest segmentation; needs org firewall changes |
| **B - Dual-homed HF** | One heavy forwarder has a NIC on the org network and a NIC on the kit data VLAN; it is the ONLY touchpoint | Org wants a single, auditable ingress host | HF is a choke point and a trust boundary - harden it ([11](11-security.md)) |
| **C - Passive SPAN/TAP** | A span port / network tap feeds SC4S or an HF; the kit never transmits onto the org net | Strict no-touch / covert / read-only monitoring | Capture only; no UF management, no bidirectional sources |

In all models the kit's **DHCP must not reach the org network**
([03](03-network-design.md#kit-services-dns-dhcp-ntp)) and the kit does not act as a
router for org traffic.

## Site network questionnaire

Fill this in before departure if possible, otherwise on arrival. It is the input to the
ingestion-path decision and the firewall-rule request.

**Addressing and routing**
- Org IP ranges / VLANs in scope? Any overlap with the kit `10.73.0.0/16` plan?
- Will the kit get a routed interface or NAT? Static IP assigned to the kit site NIC?
- Gateway, and is inter-VLAN routing to the sources available?

**Name resolution and time**
- Internal DNS servers? Will the kit be allowed to query them (for host enrichment)?
- Is an org NTP source required/available, or does the kit stay authoritative?

**Egress and proxy**
- Is any internet egress allowed (for connected mode)? Through a proxy? Proxy host/port/auth?
- Firewall change process and approver - how long does a rule take?

**Sources (the core of onboarding)**
- Which data sources exist? (Windows/AD, Linux, network firewalls, proxies, DNS, EDR,
  cloud/SaaS, applications, custom.) See the Flyaway Kit app concept
  ([15](15-flyaway-kit-app-concept.md)) for the structured checklist.
- For each: where does it live, how many hosts, approximate EPS/volume, and how is it
  emitted today (agent, syslog, API)?
- Existing Splunk/UF/forwarder infrastructure on site the kit should receive from or avoid
  conflicting with?
- Any cloud/API sources (need egress) vs. on-prem only?

**Constraints**
- Data classification / handling rules at this site ([11](11-security.md#data-classification))?
- May the kit install UFs on org endpoints, or only receive what the org sends?
- Any assets explicitly out of scope?

## Ingestion-path decision

Map each source type to a collection method. This drives which TA, which DS serverclass,
and which firewall rule.

| Source type | Method | Lands on | TA example |
|-------------|--------|----------|-----------|
| Windows / AD / Sysmon | UF (installed on hosts, managed by kit DS) | Indexers via 9997 | Splunk_TA_windows, Splunk_TA_microsoft_sysmon |
| Linux / Unix | UF | Indexers via 9997 | Splunk_TA_nix |
| Network / security devices (firewall, proxy, DNS appliances) | Syslog -> SC4S | SC4S -> indexers | SC4S source config + CIM |
| EDR / SaaS / cloud (API) | HF modular/API input | HF -> indexers | vendor API TA (needs egress) |
| Applications | HEC | HF/indexers via 8088 | app-specific |
| Collected artifacts / one-off files | Upload / `oneshot` | Indexers | per data |

Decision notes:
- **UF** is preferred for managed endpoints: the kit DS pushes the TA and config
  ([05](05-splunk-deployment.md#deployment-server-forwarder-management)); UFs point their
  `outputs.conf` at the kit indexers.
- **SC4S** is preferred over raw `udp://514` for syslog: it parses, sets sourcetype/index,
  and is Splunk-supported.
- **HF** is needed wherever an input requires code/credentials (API pulls) or routing.
- **HEC** for app/cloud push with scoped tokens.

## Firewall rules per path (what the org must open)

Request the minimum. "Kit" = the kit's site-facing interface(s); ports from
[03](03-network-design.md#splunk-ports-matrix).

| Path | Source -> Destination | Port | Direction |
|------|-----------------------|------|-----------|
| UF -> indexers | Org endpoints -> kit indexers (or HF) | 9997/TCP | Org -> Kit |
| UF mgmt (DS) | Org UFs -> kit DS | 8089/TCP | Org -> Kit |
| Syslog -> SC4S | Devices -> kit SC4S | 514/UDP+TCP, 6514/TCP (TLS) | Org -> Kit |
| HEC | App/cloud senders -> kit HF/indexers | 8088/TCP | Org -> Kit |
| API pull (HF) | Kit HF -> SaaS/cloud API | 443/TCP | Kit -> Internet (via proxy if required) |
| DNS enrichment (optional) | Kit -> org DNS | 53/UDP+TCP | Kit -> Org |

Keep everything else denied. For model B (dual-homed HF), only the HF's org-side address
appears in these rules - that single host is the whole attack/audit surface.

## Validation after integration

- Each onboarded source appears within minutes:
  ```spl
  index=* earliest=-15m | stats count latest(_time) as last_seen by index, sourcetype, host
  ```
- Sourcetypes are correct (not `*-too_small`/`syslog` catch-alls) and CIM-mapped for ES.
- The Flyaway Kit app's per-source check turns green ([15](15-flyaway-kit-app-concept.md)).
- No unexpected flows in the firewall deny log; no kit DHCP leaking to the org net.

</script>
<script type="text/markdown" data-id="14-remote-replication-vpn" data-title="14 - Remote Replication &amp; VPN" data-group="Connect" data-file="docs/14-remote-replication-vpn.md">
# 14 - Remote Replication and VPN

Optional. When a mission has a usable link, the kit can mirror some or all of its data to
a remote data center or cloud so a copy survives even if the kit is lost, and so analysts
back home can search it. This document covers the VPN transport options, the data
mirroring options with bandwidth trade-offs, and how it ties into the firewall and
security.

This is a connected-mode feature. Air-gapped missions skip it entirely; the primary data
path is always local ([06](06-offline-repo.md#connected-mode-policy)).

## Transport options

The replication traffic rides a VPN from the kit to the remote site, terminated on the kit
firewall ([03](03-network-design.md#firewall-policy), VLAN 40).

```mermaid
flowchart LR
    subgraph kit [Flyaway Kit]
        idx[Indexers]
        fw[KitFirewall]
    end
    subgraph remote [Remote DC / Cloud]
        ridx[RemoteIndexers]
        gw[VPNGateway / Headscale]
    end
    idx --> fw
    fw <-->|"IPsec OR WireGuard mesh"| gw
    gw --> ridx
```

### Option 1 - Site-to-site IPsec

- Kit firewall (Cisco Secure Firewall 1210, default, or similar) builds an IPsec tunnel to a remote
  VPN gateway: a corporate DC firewall, or a cloud VPN gateway (AWS VPN, Azure VPN
  Gateway, GCP Cloud VPN).
- Auth: certificate preferred, PSK acceptable if long/unique per mission
  ([11](11-security.md#vpn-key-handling)).
- Firewall ports on the VPN VLAN: IKE UDP/500, NAT-T UDP/4500, ESP.
- **Meraki note:** if both ends are Meraki, Auto VPN simplifies setup - but Meraki needs
  the cloud dashboard, so this is connected-mode only and not for air-gapped/sensitive
  missions ([02](02-hardware-bom.md#firewall-reference)).

### Option 2 - Self-hosted Headscale (WireGuard mesh)

[Headscale](https://github.com/juanfont/headscale) is an open-source, self-hostable
implementation of the Tailscale control server. It gives the kit a private WireGuard mesh
without any third-party SaaS - which fits a sovereignty/air-gap-adjacent posture better
than a commercial coordination service.

- **Control server placement:**
  - At the **remote DC/cloud** - the kit nodes (or the firewall) join the mesh and reach
    the remote indexers over WireGuard. This is the remote-replication use.
  - On the kit **management node** - when you only need to coordinate kit nodes among
    themselves (e.g. an internal overlay); no remote dependency.
- Each node has its own WireGuard keypair; the Headscale server holds node keys + ACLs.
  Use short-lived single-use pre-auth keys to enroll nodes; revoke at teardown
  ([11](11-security.md#vpn-key-handling)).
- Firewall: WireGuard UDP (default 41641) plus the Headscale control/HTTPS port to the
  control server.
- Carry the Headscale binary/image and client packages on the offline media if used
  ([06](06-offline-repo.md)).

| Transport | Pro | Con | Best for |
|-----------|-----|-----|----------|
| IPsec | Standard, firewall-native, works with cloud VPN gateways | Per-peer config; NAT traversal can be fiddly | Fixed kit-to-DC/cloud link |
| Headscale/WireGuard | Self-hosted, simple mesh, no SaaS, fast | You run the control server; newer tooling | Sovereign/multi-node overlays |

## Data mirroring options

How much data crosses the link - choose per available bandwidth. Estimate link demand
before enabling; a saturated uplink will back-pressure indexing.

### A - Forwarded clone (simplest)

Clone the ingest stream: the kit forwarders (or indexers) send a second copy to the remote
indexers via an additional `tcpout` group.

```ini
# outputs.conf on HF/indexers - add a cloned remote group
[tcpout]
defaultGroup = kit_idx

[tcpout:kit_idx]
server = idx01.kit.local:9997, idx02.kit.local:9997, idx03.kit.local:9997

[tcpout:remote_idx]
server = ridx01.remote.example:9997
# cloned output: data goes to BOTH groups
```

```ini
# inputs.conf - send a given input to both groups
[monitor:///var/log/mission]
_TCP_ROUTING = kit_idx, remote_idx
```

- **Bandwidth:** roughly the ingest rate you clone (post-parsing, compressed on the wire).
  Mirroring all of a 100 GB/day stream needs ~10+ Mbps sustained; size to the subset you
  clone.
- **Pro:** simple, near-real-time, no cluster coupling. **Con:** remote is a separate copy,
  not a cluster member; if the link drops, use `useACK` and queue/`maxQueueSize` so the HF
  buffers and backfills rather than dropping.

### B - Multisite indexer cluster (full fidelity, bandwidth-heavy)

Make the remote indexers a second site of the kit's indexer cluster with site-aware
replication/search factors.

- **Pro:** remote site is a true cluster member; search affinity and site failover.
- **Con:** replication (9887) between sites is **bandwidth- and latency-sensitive**; a thin
  or jittery field link is a poor fit. Generally only for missions with a fat, stable link.
- Set `site_replication_factor` / `site_search_factor` so the remote holds the copies you
  want; expect replication traffic on the order of your ingest times the remote copy count.

### C - Scheduled export (low-bandwidth / intermittent)

For thin or intermittent links, don't stream - batch.

- Periodically export the mission indexes' buckets or summary/CSV results and ship them
  over the link when it's up (rsync-over-VPN, or scheduled `outputcsv`/report export).
- **Pro:** tolerant of outages; you control exactly when the link is used. **Con:** not
  real-time; the remote lags by the export interval.
- Pairs well with tactical missions ([12](12-mission-profiles.md#tactical--disconnected-operations)).

| Option | Bandwidth need | Latency | Link tolerance | Remote is... |
|--------|----------------|---------|----------------|--------------|
| A Forwarded clone | Moderate (= cloned ingest) | Near real-time | Buffers via ACK/queue | Separate copy |
| B Multisite cluster | High (ingest x remote copies) | Real-time | Poor (needs stable link) | Cluster member |
| C Scheduled export | Low, bursty | Interval lag | Excellent | Periodic archive |

## Bandwidth planning

```
clone_mbps ~= cloned_GB_per_day * 8 * 1000 / 86400 * compression_factor
            (compression_factor ~0.3-0.5 on the wire)
```
Example: cloning 50 GB/day -> `50*8*1000/86400 ~= 4.6 Mbps` raw, ~1.5-2.3 Mbps compressed
sustained. Multisite adds replication overhead per remote copy. Always leave headroom so
replication never starves local indexing.

## Security and teardown

- VPN keys/certs live on the firewall / Headscale server only, rotated at teardown
  ([11](11-security.md#vpn-key-handling)); revoke Headscale nodes and reset the firewall
  VPN config.
- The remote peer config reveals remote topology - treat as sensitive, wipe at teardown.
- If a remote mirror is the authoritative copy for evidence, confirm it is complete and
  checksum-verified before wiping the local copy
  ([10](10-runbook-teardown.md#phase-2--export--preserve)).

## Validation

- Tunnel up: ping/`reachability` to the remote indexers over the VPN VLAN only.
- Option A: events appear on the remote indexers within seconds:
  ```spl
  index=mission_* | stats count by splunk_server
  ```
  (run on a remote search head) shows remote indexers accumulating.
- Option B: `splunk show cluster-status` reports both sites healthy.
- Option C: last export batch landed and checksums match.
- Link not saturated: local indexing latency stays near zero in the MC
  ([09](09-runbook-operations.md)).

</script>
<script type="text/markdown" data-id="15-flyaway-kit-app-concept" data-title="15 - Flyaway Kit App (Concept)" data-group="Connect" data-file="docs/15-flyaway-kit-app-concept.md">
# 15 - Flyaway Kit App (Concept)

> **Concept only - not built.** This document is a design for a Splunk app that would help
> the team onboard an organization's data sources correctly and fast. It defines the
> purpose, workflow, data model, wireframe, and validation logic so the app can be built
> later. No code is delivered here.

## Problem it solves

On arrival the team must figure out, under time pressure, which of the org's data sources
exist, which Splunk add-on (TA) and collection method each needs, where it should land,
and whether it is actually reporting. Today that lives in people's heads and a
[spreadsheet questionnaire](13-site-integration.md#site-network-questionnaire). The app
turns that into a guided, checkable workflow with a live "is it working?" signal.

## Workflow

```mermaid
flowchart LR
    pick["1. Check off sources the org has"] --> map["2. App shows required TA + method + index"]
    map --> stage["3. Confirm TA on media / DS serverclass"]
    stage --> deploy["4. Deploy UF/HF/HEC/SC4S"]
    deploy --> verify["5. Live validation search goes GREEN"]
    verify --> cim["6. CIM / ES data model coverage shown"]
```

1. **Select sources.** The analyst checks off the source types the org has (from the
   questionnaire): Windows/AD, Sysmon, Linux, firewalls, proxies, DNS, EDR, cloud/SaaS,
   custom apps, etc.
2. **App maps each source** to its required TA, collection method (UF / HF / HEC / SC4S),
   the DS serverclass that should carry it, and the target index/sourcetype.
3. **Staging check:** the app confirms the TA is present on the offline media / installed
   on the DS, and that the serverclass exists.
4. **Deploy** the collection per [13](13-site-integration.md#ingestion-path-decision).
5. **Live validation:** a per-source saved search turns the row **green** when matching
   data arrives at the right index/sourcetype, **amber** if partial (wrong sourcetype,
   low volume), **red** if nothing.
6. **CIM / ES coverage:** shows which CIM data models the onboarded sources populate, so
   analysts know which ES content will work.

## Data model (KV store)

The app's state lives in a KV store collection so it is editable and searchable. Concept
schema:

```json
// collection: flyaway_sources
{
  "source_key": "windows_security",      // stable id
  "display_name": "Windows Security / AD",
  "category": "endpoint",
  "required_ta": "Splunk_TA_windows",
  "ta_version": "<pinned>",
  "method": "uf",                          // uf | hf | hec | sc4s | upload
  "serverclass": "windows_sources",
  "target_index": "mission_wineventlog",
  "expected_sourcetypes": ["WinEventLog:Security","XmlWinEventLog:Security"],
  "cim_models": ["Authentication","Change"],
  "selected": true,                        // checked off by analyst
  "status": "green",                       // green|amber|red|pending (computed)
  "last_seen": "2026-11-18T14:05:00Z",
  "notes": ""
}
```

A second small collection `flyaway_site` holds the questionnaire answers
([13](13-site-integration.md#site-network-questionnaire)) so the app has the site context
(IP ranges, proxy, firewall process) in one place.

A seed catalog ships with the app: the common source types pre-filled with their TA,
method, and expected sourcetypes, so step 2 is a lookup, not data entry.

## Validation logic (per source)

Each source row's status is computed by a search like:

```spl
| tstats count latest(_time) as last_seen
    where index=$target_index$ sourcetype IN ($expected_sourcetypes$) by sourcetype
| eval status = case(
    count > 0 AND now()-last_seen < 900, "green",
    count > 0, "amber",
    1=1, "red")
```

- **green:** data in the right index/sourcetype within the last 15 min.
- **amber:** data exists but stale, or landing in an unexpected sourcetype.
- **red:** nothing - check the firewall rule, serverclass, and UF phone-home
  ([09](09-runbook-operations.md#common-failures)).

A CIM-coverage view cross-checks `expected_sourcetypes` against the accelerated ES data
models to show what correlation content will populate.

## Wireframe

```
+-----------------------------------------------------------------------+
| Flyaway Kit - Data Source Onboarding            Tier: Medium  [Site v] |
+-----------------------------------------------------------------------+
| [ Filter: all | endpoint | network | cloud | custom ]   [+ Add source]|
+-----+--------------------------+--------+----------+-------------------+
| sel | Source                   | Method | Index    | Status            |
+-----+--------------------------+--------+----------+-------------------+
| [x] | Windows Security / AD    | UF     | wineven..| GREEN  (12s ago)  |
| [x] | Sysmon                   | UF     | sysmon   | AMBER  (wrong st) |
| [x] | Palo Alto firewall       | SC4S   | firewall | RED    (no data)  |
| [ ] | CrowdStrike EDR (API)    | HF     | edr      | --                |
| [x] | Linux syslog             | UF     | nix      | GREEN  (5s ago)   |
+-----+--------------------------+--------+----------+-------------------+
| CIM coverage: Authentication [OK]  Network Traffic [partial]  ...      |
+-----------------------------------------------------------------------+
| Required TAs:  Splunk_TA_windows OK | Splunk_TA_nix OK | PA TA MISSING |
+-----------------------------------------------------------------------+
```

## How it ties into the kit

- **Seed catalog** maps 1:1 to the DS serverclasses in
  [05](05-splunk-deployment.md#deployment-server-forwarder-management) and the ingestion
  paths in [13](13-site-integration.md#ingestion-path-decision).
- **Required-TA check** reads against the offline media manifest
  ([06](06-offline-repo.md#manifestyaml)) so a missing TA is caught before deploy.
- **Status rows** reuse the operational validation searches
  ([09](09-runbook-operations.md#key-health-searches)).

## If/when it is built (out of scope now)

- Package as a standard Splunk app (KV store collections + `transforms.conf` lookups + a
  dashboard-studio or SimpleXML UI + the saved searches above).
- Install on the ES SH (or ad-hoc SH).
- Keep the seed catalog in version control alongside this repo so new source mappings are
  reviewed and travel on the offline media.

> This remains a concept. Building it is explicitly out of scope for this documentation
> set ([README](../README.md#out-of-scope)).

</script>
<script type="text/markdown" data-id="appendix-checklists" data-title="Appendix - Checklists" data-group="Reference" data-file="docs/appendix-checklists.md">
# Appendix - Checklists

Printable, mission-agnostic checklists. Print and carry; initial each line. They
summarize the runbooks - the detail lives in [08](08-runbook-deploy.md),
[09](09-runbook-operations.md), and [10](10-runbook-teardown.md).

## Pre-departure (at base)

- [ ] Tier selected for expected daily volume and retention
- [ ] All hosts imaged to the OS baseline ([04](04-os-baseline.md))
- [ ] OS baseline self-check passed on every host (below)
- [ ] Offline media refreshed; `MANIFEST.yaml` updated with pinned versions
- [ ] `sha256sum -c CHECKSUMS.sha256` passes on BOTH media drives
- [ ] License present and NOT near expiry
- [ ] Required apps/TAs and mission profile content on media
- [ ] Secrets record prepared (sealed/encrypted)
- [ ] Hardware inventory by serial/asset tag complete; spares packed
- [ ] Switch/firewall configs staged (Catalyst/Secure FW for air-gap; Meraki only if connected)
- [ ] UPS charged; PDU, region power adapters, cables (10G-rated) labeled and packed
- [ ] Printed runbooks + these checklists in the kit

## OS baseline self-check (per host)

- [ ] Hostname + static IP match the IP plan ([03](03-network-design.md))
- [ ] THP disabled (`cat /sys/kernel/mm/transparent_hugepage/enabled` -> `[never]`)
- [ ] ulimits for `splunk`: `nofile>=64000`, `nproc>=16000`
- [ ] chrony synced (`chronyc tracking`)
- [ ] `splunk` user + `/opt/splunk` volume present (`phantom` + `/opt/phantom` on SOAR)
- [ ] firewalld active, default-deny, host's ports open
- [ ] SELinux enforcing (`getenforce`)
- [ ] Resolvable by name from `mgmt`

## Arrival / deployment

Phases per [08](08-runbook-deploy.md).

- [ ] Phase 0: switch + firewall up; all hosts cabled, powered, reachable
- [ ] Phase 1: DNS, DHCP (reserved range), NTP verified from a client
- [ ] Phase 2: offline media verified on site; license not expired
- [ ] Phase 3: LM -> CM -> indexers -> DS -> SHs -> MC up in order
- [ ] Phase 3: cluster complete (`splunk show cluster-status`), RF/SF met (M/L)
- [ ] Phase 3: ES SH lists all indexers as search peers
- [ ] Phase 4: HF/HEC/SC4S up; outputs reach indexers
- [ ] Phase 5: SOAR connected to ES SH; optional AI server harness + MCP up (data posture checked)
- [ ] Phase 6 VALIDATION GATE - all must pass:
  - [ ] `| rest /services/server/info` lists every instance at the right version
  - [ ] Synthetic event searchable via forwarder path
  - [ ] Synthetic event searchable via HEC
  - [ ] Synthetic event searchable via SC4S syslog
  - [ ] MC all green; no missing peers / replication alerts
  - [ ] Time within tolerance on all hosts
  - [ ] ES loads; targeted data models populate
- [ ] Phase 7: site VLAN connected; onboarding started ([13](13-site-integration.md))
- [ ] Remote replication up and verified if used ([14](14-remote-replication-vpn.md))

## Daily operations (per shift)

Per [09](09-runbook-operations.md).

- [ ] MC all green; no skipped searches; no indexing latency alerts
- [ ] Cluster status: peers up, RF/SF met (M/L)
- [ ] Each expected source reporting within last 15 min
- [ ] Every indexer data volume < 80% full
- [ ] Time in sync everywhere
- [ ] UPS load/runtime nominal; no host unexpectedly on battery
- [ ] Firewall deny log reviewed for unexpected site traffic

## Teardown

Per [10](10-runbook-teardown.md). Do NOT wipe before export + verified handoff.

- [ ] Site VLAN disconnected; ingest stopped; in-flight data drained
- [ ] Required data exported; artifacts checksummed (sha256)
- [ ] Remote mirror confirmed complete (if used)
- [ ] Evidence handed off; chain-of-custody form signed/acknowledged
- [ ] Handoff confirmed readable/complete by recipient
- [ ] Secure wipe of all data volumes (method per classification)
- [ ] Firewall + switch configs reset to clean baseline
- [ ] All secrets rotated (cluster/SHC keys, HEC tokens, VPN keys, admin creds, FDE keys)
- [ ] Wipe method + verification recorded per device
- [ ] Hardware inventoried against BOM; damage/spares noted
- [ ] Offline media re-verified or flagged for refresh
- [ ] Repacked to foam; cables coiled/labeled
- [ ] Post-mission report written ([10](10-runbook-teardown.md#phase-6--post-mission-report))

</script>

<script src="assets/marked.min.js"></script>
<script src="assets/mermaid.min.js"></script>
<script>
(function(){
  "use strict";
  // ---- Collect embedded docs ----
  var docEls = Array.prototype.slice.call(document.querySelectorAll('script[type="text/markdown"]'));
  var docs = docEls.map(function(el){
    var file = el.getAttribute('data-file');
    return {
      id: el.getAttribute('data-id'),
      title: el.getAttribute('data-title'),
      group: el.getAttribute('data-group') || 'Documentation',
      file: file,
      base: file.split('/').pop().toLowerCase(),
      md: el.textContent,
      html: null,        // lazy-rendered
      toc: null,
      text: null         // plaintext for search
    };
  });
  var byId = {}, byBase = {};
  docs.forEach(function(d){ byId[d.id]=d; byBase[d.base]=d; });

  // ---- Slug (GitHub-ish, collapses repeated hyphens so authored anchors resolve) ----
  function slug(s){
    return s.toLowerCase().trim()
      .replace(/[^\w\s-]/g,'')
      .replace(/\s+/g,'-')
      .replace(/-+/g,'-')
      .replace(/^-|-$/g,'');
  }

  // ---- Markdown -> plaintext (for search) ----
  function toText(md){
    return md.replace(/```[\s\S]*?```/g,' ')
             .replace(/`[^`]*`/g,' ')
             .replace(/[#>*_|\-\[\]()]/g,' ')
             .replace(/\s+/g,' ').toLowerCase();
  }

  marked.setOptions({gfm:true, breaks:false, headerIds:false, mangle:false});

  // ---- Render a doc's markdown to an HTML string + build TOC ----
  function render(d){
    if(d.html!==null) return;
    var html = marked.parse(d.md);
    var tmp = document.createElement('div');
    tmp.innerHTML = html;

    // Heading ids + anchor links + TOC
    var used = {}, toc = [];
    tmp.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(function(h){
      var base = slug(h.textContent) || 'section';
      var id = base, i=1;
      while(used[id]){ id = base+'-'+(++i); }
      used[id]=true; h.id=id;
      if(h.tagName==='H2'||h.tagName==='H3'){
        toc.push({level:h.tagName==='H2'?2:3, id:id, text:h.textContent});
        var a=document.createElement('a');
        a.className='anchor-link'; a.href='#'; a.textContent='#';
        a.setAttribute('data-anchor',id);
        h.appendChild(a);
      }
    });

    // Code blocks: copy button; mermaid conversion
    tmp.querySelectorAll('pre > code').forEach(function(code){
      var pre = code.parentNode;
      var cls = code.className||'';
      if(/language-mermaid/.test(cls)){
        var div=document.createElement('div');
        div.className='mermaid';
        div.setAttribute('data-src', code.textContent);
        div.textContent = code.textContent;
        pre.parentNode.replaceChild(div, pre);
        return;
      }
      var btn=document.createElement('button');
      btn.className='copy-btn'; btn.type='button'; btn.textContent='Copy';
      pre.appendChild(btn);
    });

    // Tables: wrap for horizontal scroll
    tmp.querySelectorAll('table').forEach(function(t){
      var w=document.createElement('div'); w.className='table-wrap';
      t.parentNode.insertBefore(w,t); w.appendChild(t);
    });

    // External links open in new tab
    tmp.querySelectorAll('a[href]').forEach(function(a){
      var href=a.getAttribute('href');
      if(/^https?:\/\//i.test(href)){ a.target='_blank'; a.rel='noopener'; }
    });

    d.html = tmp.innerHTML;
    d.toc = toc;
  }

  // ---- Build sidebar ----
  var navList = document.getElementById('navList');
  var groups = [];
  docs.forEach(function(d){ if(groups.indexOf(d.group)<0) groups.push(d.group); });
  groups.forEach(function(g){
    var lbl=document.createElement('div'); lbl.className='nav-group-label'; lbl.textContent=g; navList.appendChild(lbl);
    docs.filter(function(d){return d.group===g;}).forEach(function(d){
      var item=document.createElement('a');
      item.className='nav-item'; item.href='#/'+d.id; item.textContent=d.title;
      item.setAttribute('data-id',d.id); d.navEl=item;
      (function(docId){ item.addEventListener('click', function(ev){ ev.preventDefault(); navigate(docId, null); }); })(d.id);
      navList.appendChild(item);
      var sub=document.createElement('div'); sub.className='nav-sub'; sub.style.display='none';
      d.subEl=sub; navList.appendChild(sub);
    });
  });

  function buildSubnav(d){
    var sub=d.subEl; sub.innerHTML='';
    (d.toc||[]).forEach(function(t){
      var a=document.createElement('a');
      a.href='#/'+d.id+'/'+t.id; a.textContent=t.text;
      if(t.level===3) a.className='h3';
      a.addEventListener('click', function(ev){ ev.preventDefault(); navigate(d.id, t.id); });
      sub.appendChild(a);
    });
  }

  // ---- Content + routing ----
  var content=document.getElementById('content');
  var main=document.getElementById('main');
  var current=null;

  function showDoc(id, anchor, fromHash){
    var d=byId[id]; if(!d) d=docs[0];
    render(d);
    if(current!==d){
      content.innerHTML=d.html;
      main.scrollTop=0;
      current=d;
      docs.forEach(function(x){
        x.navEl.classList.toggle('active', x===d);
        x.subEl.style.display = (x===d) ? 'block':'none';
      });
      buildSubnav(d);
      renderMermaid();
      addDocNav(d);
      if(activeQuery) highlight(content, activeQuery);
    }
    if(anchor){
      var target=document.getElementById(anchor) || document.getElementById(slug(anchor));
      if(target){ target.scrollIntoView(); flash(target); }
    } else if(!fromHash){ main.scrollTop=0; }
    closeSidebar();
  }

  function addDocNav(d){
    var idx=docs.indexOf(d);
    var prev=docs[idx-1], next=docs[idx+1];
    var nav=document.createElement('div'); nav.className='doc-nav';
    nav.innerHTML =
      '<a class="prev'+(prev?'':' disabled')+'" '+(prev?'href="#/'+prev.id+'"':'')+'>'+
        '<span class="lbl">Previous</span><span class="ttl">'+(prev?esc(prev.title):'')+'</span></a>'+
      '<a class="next'+(next?'':' disabled')+'" '+(next?'href="#/'+next.id+'"':'')+'>'+
        '<span class="lbl">Next</span><span class="ttl">'+(next?esc(next.title):'')+'</span></a>';
    var foot=document.createElement('div'); foot.className='kit-footnote';
    foot.textContent='Generated from the Markdown sources in this repository. Edit the .md files and re-run tools/build-site.py to update this page.';
    content.appendChild(nav); content.appendChild(foot);
  }

  function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  function flash(el){
    el.style.transition='background .3s'; var o=el.style.background;
    el.style.background='var(--mark)';
    setTimeout(function(){el.style.background=o;},650);
  }

  // ---- Mermaid ----
  var mermaidReady=false;
  function initMermaid(){
    if(typeof mermaid==='undefined') return false;
    if(!mermaidReady){
      mermaid.initialize({startOnLoad:false, securityLevel:'loose',
        theme: document.documentElement.getAttribute('data-theme')==='light'?'default':'dark'});
      mermaidReady=true;
    }
    return true;
  }
  function renderMermaid(){
    if(!initMermaid()) return;
    var nodes=content.querySelectorAll('.mermaid:not([data-processed])');
    if(!nodes.length) return;
    try{ mermaid.run({nodes:nodes}); }catch(e){ /* leave as code block */ }
  }
  function rerenderMermaidTheme(){
    if(typeof mermaid==='undefined') return;
    mermaidReady=false; initMermaid();
    content.querySelectorAll('.mermaid').forEach(function(n){
      var src=n.getAttribute('data-src'); if(src!=null){ n.removeAttribute('data-processed'); n.innerHTML=''; n.textContent=src; }
    });
    renderMermaid();
  }

  // ---- Link handling (cross-doc .md links + in-page anchors) ----
  content.addEventListener('click', function(e){
    var a=e.target.closest('a'); if(!a) return;
    var href=a.getAttribute('href'); if(href==null) return;
    if(a.classList.contains('anchor-link')){ e.preventDefault(); navigate(current.id, a.getAttribute('data-anchor')); return; }
    if(/^https?:\/\//i.test(href)) return;            // external
    if(href.charAt(0)==='#'){ e.preventDefault(); navigate(current.id, href.slice(1)); return; }
    var m=href.match(/([^\/\\]+\.md)(?:#(.*))?$/i);
    if(m){
      e.preventDefault();
      var d=byBase[m[1].toLowerCase()];
      if(d) navigate(d.id, m[2]?slug(m[2]):null);
    }
  });

  // ---- Copy buttons ----
  content.addEventListener('click', function(e){
    var b=e.target.closest('.copy-btn'); if(!b) return;
    var code=b.parentNode.querySelector('code');
    var txt=code?code.innerText:'';
    navigator.clipboard && navigator.clipboard.writeText(txt).then(function(){
      b.textContent='Copied'; b.classList.add('copied');
      setTimeout(function(){b.textContent='Copy'; b.classList.remove('copied');},1200);
    });
  });

  // ---- Navigation (direct; does not depend on hashchange firing) ----
  function navigate(id, anchor){
    showDoc(id, anchor, false);
    var h='#/'+id+(anchor?('/'+anchor):'');
    if(location.hash!==h){ try{ location.hash=h; }catch(e){} }  // keep URL in sync for bookmarks/back
  }
  function route(){
    var h=location.hash.replace(/^#\/?/,'');
    var parts=h.split('/');
    var id=parts[0]||docs[0].id;
    var anchor=parts[1]||null;
    if(!byId[id]) id=docs[0].id;
    showDoc(id, anchor, true);
  }
  // Back/forward support when the browser does fire hashchange; harmless no-op otherwise.
  window.addEventListener('hashchange', route);

  // ---- Search ----
  var searchEl=document.getElementById('search');
  var clearEl=document.getElementById('searchClear');
  var noRes=document.getElementById('noResults');
  var activeQuery='';
  docs.forEach(function(d){ d.text=toText(d.md)+' '+d.title.toLowerCase(); });

  function doSearch(){
    var q=searchEl.value.trim().toLowerCase();
    activeQuery=q.length>=2?q:'';
    clearEl.style.display=q?'block':'none';
    var any=false;
    docs.forEach(function(d){
      var match = !activeQuery || d.text.indexOf(activeQuery)>=0;
      d.navEl.classList.toggle('hidden', !match);
      if(d!==current) d.subEl.style.display='none';
      if(match) any=true;
    });
    document.querySelectorAll('.nav-group-label').forEach(function(l){ l.style.display=''; });
    noRes.style.display=any?'none':'block';
    clearHighlights(content);
    if(activeQuery) highlight(content, activeQuery);
  }
  searchEl.addEventListener('input', doSearch);
  clearEl.addEventListener('click', function(){ searchEl.value=''; doSearch(); searchEl.focus(); });

  function clearHighlights(root){
    root.querySelectorAll('mark').forEach(function(m){
      var t=document.createTextNode(m.textContent); m.parentNode.replaceChild(t,m);
    });
    root.normalize();
  }
  function highlight(root, q){
    var walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode:function(n){
        if(!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        var p=n.parentNode.nodeName;
        if(p==='SCRIPT'||p==='STYLE'||p==='MARK') return NodeFilter.FILTER_REJECT;
        if(n.parentNode.closest && n.parentNode.closest('.mermaid')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodes=[], n;
    while((n=walker.nextNode())) nodes.push(n);
    nodes.forEach(function(node){
      var val=node.nodeValue, lc=val.toLowerCase(), idx=lc.indexOf(q);
      if(idx<0) return;
      var frag=document.createDocumentFragment(), last=0;
      while(idx>=0){
        if(idx>last) frag.appendChild(document.createTextNode(val.slice(last,idx)));
        var m=document.createElement('mark'); m.textContent=val.slice(idx,idx+q.length); frag.appendChild(m);
        last=idx+q.length; idx=lc.indexOf(q,last);
      }
      if(last<val.length) frag.appendChild(document.createTextNode(val.slice(last)));
      node.parentNode.replaceChild(frag,node);
    });
  }

  // ---- Theme ----
  var themeBtn=document.getElementById('themeBtn');
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme',t);
    try{ localStorage.setItem('fak-theme',t); }catch(e){}
    rerenderMermaidTheme();
  }
  themeBtn.addEventListener('click', function(){
    applyTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light');
  });
  (function(){ var saved; try{saved=localStorage.getItem('fak-theme');}catch(e){} if(saved) document.documentElement.setAttribute('data-theme',saved); })();

  // ---- Print ----
  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });

  // ---- Mobile sidebar ----
  var sidebar=document.getElementById('sidebar'), scrim=document.getElementById('scrim');
  function closeSidebar(){ sidebar.classList.remove('open'); scrim.classList.remove('show'); }
  document.getElementById('menuBtn').addEventListener('click', function(){ sidebar.classList.toggle('open'); scrim.classList.toggle('show'); });
  scrim.addEventListener('click', closeSidebar);

  // ---- Go ----
  route();
})();
</script>
</body>
