# Splunk Flyaway Kit

A portable, rapidly deployable Splunk Enterprise environment built from ruggedized
laptops and small-form-factor desktop PCs running Linux. The kit is designed to be
carried to a site, powered on, networked, and ingesting data within a short, repeatable
window - whether the site has internet access or is fully air-gapped.

This repository is **documentation only**. It is the design, bill of materials, network
plan, build standard, deployment runbooks, and operational procedures for assembling and
operating the kit. It contains no automation or OS images (see
[Out of scope](#out-of-scope)), but the runbooks carry copy-paste configuration snippets
so they can be acted on directly.

## Missions

The kit is general-purpose and sized to cover three mission profiles (see
[docs/12-mission-profiles.md](docs/12-mission-profiles.md)):

- **Incident response / DFIR** - stand up a collection and analysis platform at a
  customer or field site, with evidence handling and chain-of-custody discipline.
- **Tactical / disconnected operations** - monitoring in environments with little or no
  connectivity (field, disaster response, exercise).
- **Demo / training / workshop** - a self-contained teaching or proof-of-value
  environment.

## Tiers

The kit comes in three sizes. Pick the smallest tier that meets the daily ingest and
retention requirement.

| Tier | Kit Hosts | Daily ingest | Indexing | Search | Use when |
| --- | --- | --- | --- | --- | --- |
| **Small** | ~4-6 | < 50 GB/day | 1 standalone indexer OR 2-node index cluster | Single ES search head | One-off IR, small site, demo |
| **Medium** | ~7-10 | 50-300 GB/day | 2-node indexer cluster (RF=2, SF=2) | ES search head + optional ad-hoc SH | Most field deployments |
| **Large** | 12+ | 300 GB+/day | 4-6 node indexer cluster | 3-member ES search head cluster + deployer | High-volume or long-retention missions |

All tiers run the same software baseline (Splunk Enterprise 10.6, SOAR On-premises 8.7)
and differ only in node count and role distribution. See
[docs/01-architecture.md](docs/01-architecture.md).

## Connectivity modes

Every procedure supports both:

- **Air-gapped** - all installers, OS packages, apps, add-ons, licenses, and checksums
  are carried on the kit's offline media. No internet required. See
  [docs/06-offline-repo.md](docs/06-offline-repo.md).
- **Connected / intermittent** - optional online updates and optional remote data
  replication over a site-to-site VPN or a self-hosted Headscale mesh. See
  [docs/14-remote-replication-vpn.md](docs/14-remote-replication-vpn.md).

# 01 - Architecture

This document defines the Splunk roles in the kit, how they map to physical hardware
(laptops and desktops), the per-tier topologies, and the sizing math used to choose a
tier.

## Design principles

- **Smallest thing that works.** Pick the lowest tier that meets daily ingest and
  retention. Every added node is more weight, power, setup time, and failure surface.
- **Desktops index, laptops manage and search.** Desktops carry the CPU and NVMe needed
  for indexing and replication. Laptops run search, management, and ingest roles - they
  are portable and each has a built-in UPS (its battery) that rides out power blips.
- **Repeatable role assignment.** The same hostname/role map is used every deployment so
  the runbooks, configs, and the IP plan never change between missions.
- **Honest colocation.** Where kit constraints push roles onto one host, the deviation
  from Splunk's reference guidance is called out explicitly (see
  [Management role colocation](#management-role-colocation)).

## Roles

All roles sit on the kit LAN (see [03-network-design.md](03-network-design.md)) and are
networked together through the kit switch and firewall.

| Role | Purpose | Typical host |
|------|---------|--------------|
| **ES search head** | Splunk Enterprise Security - the analyst UI, correlation searches, notables, data models | Laptop (dedicated) |
| **Ad-hoc search head** | Non-ES searching, hunting, dashboards (optional) | Laptop |
| **Indexer** | Parse, index, store, and search data | Desktop (NVMe) |
| **Cluster manager (CM)** | Coordinates the indexer cluster (Medium/Large only) | Laptop / mgmt host |
| **License manager (LM)** | Central license repository | Mgmt host |
| **Deployment server (DS)** | Pushes apps/TAs to forwarders and other clients | Mgmt host |
| **Monitoring console (MC)** | Health of the whole deployment | Mgmt host |
| **SH cluster deployer** | Pushes config to ES SH cluster members (Large only) | Mgmt host |
| **HEC / token management** | HTTP Event Collector endpoint and token admin | Ingest/HF host |
| **Heavy forwarder (HF)** | Modular/API inputs, routing, the dual-homed site touchpoint | Laptop/desktop |
| **SC4S** | Splunk Connect for Syslog (containerized syslog ingest) | Ingest host |
| **SOAR** | Splunk SOAR On-premises - automation/playbooks | Desktop (RHEL-family) |
| **AI server** (optional) | AI harness (local or subscription) wired to the Splunk MCP server - see [AI server](#ai-server-optional) | Simple PC or laptop |
| **Kit services** | DNS, DHCP (kit LAN), NTP (chrony) | Mgmt host |

### Management role colocation

Splunk's reference guidance on combining management components
([Components that help to manage your deployment](https://help.splunk.com/en/splunk-enterprise/administer/distributed-deployment-manual/10.6/overview-of-splunk-enterprise-distributed-deployments/components-that-help-to-manage-your-deployment))
gives this colocation matrix:

| Component | LM | MC | DS | CM | Deployer | Indexer | Search head |
|-----------|----|----|----|----|----------|---------|-------------|
| License manager | - | yes | yes | yes | yes | yes | yes |
| Monitoring console | yes | - | yes | yes | yes | **no** | yes |
| Deployment server | yes | yes | - | **no** | yes | yes | yes |
| Cluster manager | yes | yes | **no** | - | yes | **no** | **no** |
| SH cluster deployer | yes | yes | yes | yes | - | **no** | **no** |

The hard rules that affect this kit:

- **Cluster manager must not share a host with the deployment server, an indexer, or a
  search head.** Both CM and DS have strict resource limits.
- **Monitoring console must not share a host with an indexer.** With SmartStore it needs a
  dedicated search head; the kit does not use SmartStore.

Consequences per tier:

- **Small** has no indexer cluster, so there is no CM. LM + DS + MC + DNS/DHCP/NTP can
  share one management laptop because the client count and search load are tiny (MC on a
  DS is supported for < 50 clients).
- **Medium/Large** have a cluster, so the CM must be separate from the DS. The management
  roles split across two hosts (see topologies below).

> In Small and in low-load Medium kits we co-locate more management roles on
> one box than the reference architecture prefers. The ceiling is host CPU/RAM and the
> < 50 deployment-client limit for MC-on-DS. Upgrade path: promote to the Large
> two-management-host split, or add a dedicated MC laptop, if the MC or DS shows load in
> the monitoring console.

Colocation can also be done with **containers** - each role in its own Docker/Podman
container on a shared host - which is often the fastest way to consolidate the management
roles. The same resource ceilings apply at the host level. See
[07-containerization.md](07-containerization.md).

## Reference topology (all tiers)

```mermaid
flowchart LR
    orgNet[OrgNetwork] -->|"site-facing VLAN"| fw[KitFirewall]
    fw --> ingest["Ingest: HF / SC4S / HEC"]
    remote["Remote DC or Cloud"] <-->|"IPsec or Headscale WireGuard"| fw
    subgraph kitLan [Kit LAN - 10GbE switch]
        ingest --> idx[IndexerTier]
        esSh[ES_SearchHead] --> idx
        soar[SOAR] <--> esSh
        ai[AI_Server] <--> esSh
        mgmt["Mgmt: LM, CM, DS, MC, DNS, DHCP, NTP, Tokens"] -.-> idx
        mgmt -.-> esSh
        mgmt -.-> ingest
    end
    fw --> kitLan
```

## Small tier

4-6 hosts, < 50 GB/day, single analyst or small team, short retention.

| Host | Role(s) | Hardware |
|------|---------|----------|
| mgmt01 | LM + DS + MC + DNS/DHCP/NTP + HEC token admin | Laptop |
| es01 | ES search head (also runs ad-hoc search) | Laptop |
| idx01 | Standalone indexer | Desktop |
| idx02 | Standalone indexer (optional, for capacity/redundancy) | Desktop |
| hf01 | Heavy forwarder + SC4S (site touchpoint) | Laptop/desktop |
| soar01 | SOAR (optional) | Desktop (RHEL-family) |

```mermaid
flowchart TD
    hf01["hf01: HF + SC4S"] --> idx01[idx01]
    hf01 --> idx02[idx02]
    es01["es01: ES SH"] --> idx01
    es01 --> idx02
    mgmt01["mgmt01: LM+DS+MC+DNS/DHCP/NTP"] -.-> idx01
    mgmt01 -.-> idx02
    mgmt01 -.-> es01
    soar01[soar01: SOAR optional] <--> es01
```

Notes:
- Indexers are **standalone** (no cluster). Two indexers means no replication - if one
  dies, its data is unavailable until restored. If you need survivability at this size,
  step up to Medium.
- `es01` forwards its own internal logs to the indexers and does not index data locally.

## Medium tier

7-10 hosts, 50-300 GB/day. This is the default field deployment.

| Host | Role(s) | Hardware |
|------|---------|----------|
| mgmt01 | CM + LM + MC | Laptop |
| mgmt02 | DS + DNS + DHCP + NTP | Laptop |
| es01 | ES search head | Laptop |
| sh01 | Ad-hoc search head (optional) | Laptop |
| idx01-03 | Indexer cluster peers (RF=2, SF=2) | Desktop x3 |
| hf01 | Heavy forwarder + HEC | Laptop/desktop |
| sc4s01 | SC4S syslog ingest | Laptop/desktop |
| soar01 | SOAR | Desktop (RHEL-family) |
| ai01 | AI server (optional) | Simple PC/laptop |

```mermaid
flowchart TD
    subgraph ingestTier [Ingest]
        hf01["hf01: HF + HEC"]
        sc4s01["sc4s01: SC4S"]
    end
    subgraph idxCluster ["Indexer cluster RF=2 SF=2"]
        idx01[idx01]
        idx02[idx02]
        idx03[idx03]
    end
    hf01 --> idxCluster
    sc4s01 --> idxCluster
    es01["es01: ES SH"] --> idxCluster
    sh01["sh01: ad-hoc SH"] --> idxCluster
    mgmt01["mgmt01: CM+LM+MC"] --> idxCluster
    mgmt02["mgmt02: DS+DNS+DHCP+NTP"] -.-> hf01
    mgmt02 -.-> es01
    soar01[soar01: SOAR] <--> es01
    ai01[ai01: AI server] <--> es01
```


> Notes:
>
> - RF=2/SF=2 means each bucket has 2 copies and the cluster can lose **one** indexer with
> no data loss and full searchability. See [09-runbook-operations.md](09-runbook-operations.md)
> for degraded-mode behavior.
>
> - CM is isolated from DS per the colocation rules above.

## Large tier

12+ hosts, 300 GB+/day, longer retention, multiple analysts.

| Host | Role(s) | Hardware |
|------|---------|----------|
| mgmt01 | CM + LM + MC | Laptop/desktop |
| mgmt02 | DS + ES SH cluster deployer + DNS + DHCP + NTP | Laptop/desktop |
| es01-03 | ES search head cluster members | Laptop x3 |
| idx01-06 | Indexer cluster peers (RF=2/3, SF=2) | Desktop x4-6 |
| hf01-02 | Heavy forwarders + HEC | Laptop/desktop x2 |
| sc4s01 | SC4S syslog ingest | Laptop/desktop |
| soar01 | SOAR (cluster-capable) | Desktop (RHEL-family) |
| ai01 | AI server (optional) | Simple PC/laptop |

```mermaid
flowchart TD
    subgraph ingestTier [Ingest]
        hf["hf01-02: HF + HEC"]
        sc4s[sc4s01: SC4S]
    end
    subgraph idxCluster ["Indexer cluster 4-6 peers"]
        idxA[idx01..06]
    end
    subgraph shc ["ES SH cluster"]
        es1[es01]
        es2[es02]
        es3[es03]
    end
    hf --> idxCluster
    sc4s --> idxCluster
    shc --> idxCluster
    mgmt01["mgmt01: CM+LM+MC"] --> idxCluster
    mgmt02["mgmt02: DS+Deployer+DNS/DHCP/NTP"] -.-> shc
    mgmt02 -.-> hf
    soar01[soar01: SOAR] <--> shc
    ai01[ai01: AI server] <--> shc
```


> Notes:
>
> - The deployer (for the ES SH cluster) and the DS can colocate; neither colocates with
> the CM.
>
> - The ES SH cluster needs an odd number of members (3 shown) for its captain election.

## Sizing math

Use these to pick a tier and count indexers. They are planning estimates - validate in
the monitoring console once data flows.

**Indexer count (indexing workload)**
A reference indexer handles roughly 100-300 GB/day depending on parsing cost, search
concurrency, and hardware. For kit desktops (fast NVMe, 8+ physical cores), plan on
**~100 GB/day/indexer** sustained with headroom for search:

```
indexers = ceil(daily_ingest_GB / 100)        # standalone
indexers = ceil((daily_ingest_GB / 100) + 1)  # clustered, +1 so RF/SF survive one loss
```

**Storage per indexer**

```
raw_per_day          = daily_ingest_GB
indexed_size_per_day = daily_ingest_GB * 0.5   # rawdata ~15% + tsidx ~35% ~= ~50% of raw (rule of thumb; varies by data)
cluster_multiplier   = RF (e.g. 2)             # clustered only; standalone = 1
total_storage_GB     = indexed_size_per_day * retention_days * cluster_multiplier / indexer_count
```

Example:
200 GB/day, 30-day retention, 3 indexers, RF=2:
`200 * 0.5 * 30 * 2 / 3 = 2000 GB/indexer` -> provision ~2.5 TB NVMe/indexer.

**RAM / CPU**
Follow Splunk reference hardware: a mid-range indexer is ~12 physical cores / 12 GB RAM
minimum; search heads benefit from more RAM. ES search heads and SOAR want 64 GB+.
See [02-hardware-bom.md](02-hardware-bom.md) for the concrete per-tier specs.

## AI Server (optional)

The AI server is an **optional** add-on, reserved as `ai01` in every topology and in the
network/IP plan ([03](03-network-design.md)). It is not required to operate the kit; add
it when the mission wants AI-assisted analysis or SPL help on top of Splunk.

It is deliberately modest hardware - **a simple PC or laptop**, not a GPU box - because the
heavy lifting is done either by a local lightweight harness or by a remote
subscription/private service. The AI server's job is to run an **AI harness** and connect
it to Splunk through the **[Splunk MCP server](https://www.splunk.com/)** (Model Context
Protocol), so the agent can query Splunk and reason over results as well as establish connections to cloud-based or self-hosted AI models.

AI harnesses can be installed on this host for remote access by cyber security analysts.

#### Self-hosted AI Models

For locally and remotely hosted AI models, high-end Nvidia or AMD GPUs maybe used to host LLMs.  Linux OS distributions and LLM inference engines such as vllm or SGlang are recommended for performance and parallel inferencing jobs for air-gapped environments or organizations that do not allow remote AI services such as OpenAI, Anthropic, Google, xAI, etc.

This can also be hosted in a remote co-location, data center or office for faster and less expensive deployment purposes; access via VPN or TLS/SSL.

Depending upon the need for self-hosted AI, the AI hardware may be included as an additional asset.  Current open-weight LLMs can run on PCIe AI GPU cards such as the Nvidia RTX Pro 6000 - 96GB VRAM or AMD Instinct MI350P - 144GB VRAM.   Desktop-grade AMD or Intel CPUs and at least 64GB of DDR5 RAM and 2TB+ of storage will suffice.

Higher end server-grade CPUs and GPUs may be used, but carries the risk of weight and cost.

**<u>IMPORTANT</u>**: As of November 2026, Splunk AI Assistant and Enterprise Security AI Agent functions cannot connect or use self-hosted AI services.

There are no recommended open weight models in this document.  Individual, self-testing is required.

#### Self-hosted Splunk AI

Splunk provides [Splunk AI Operator](https://github.com/splunk/splunk-ai-operator) and [Splunk AI Tier](https://github.com/splunk/splunk-ai-operator/blob/release/v1.0/docs/ai-tier-docs/k0s-quick-reference.md) to host Splunk AI infrastructure that allows Splunk AI Assistant (SAIA) and Splunk Enterprise Security Agentic SOC features to run without Splunk AI Cloud service.

Due to the hardware requirements, it is recommended to host this remotely, accessible with a VPN connection or TLS SSL connection from the locally deployed Splunk hosts.

**<u>IMPORTANT:</u>** Splunk AI capabilities are limited to Splunk AI Assistant and Enterprise Security AI Agent functions.  One cannot have general conversations or ask questions or make requests outside of the strict guardrails in place.

For AI chat use cases outside of Splunk AI, use self-hosted AI service and/or cloud-based AI services.

#### Cloud-based AI Service Integration

Leveraging AI subscriptions such as OpenAI, Anthropic, Google, xAI, etc. can be used with the respective AI harnesses with the [Splunk MCP server](https://help.splunk.com/en/splunk-cloud-platform/mcp-server-for-splunk-platform/2.1/about-splunk-mcp-server/about-mcp-server-for-splunk-platform) connection and/or [SplunkCTL](https://github.com/splunk/splunkctl) to query Splunk indexes, generate reports, alerts, dashboards, etc.

### Harness options

| Option | What runs on `ai01` | Connectivity | Data posture |
|--------|---------------------|--------------|--------------|
| **Local harness (e.g. Pi)** | A self-contained/local AI harness such as Pi running on the PC/laptop | Works air-gapped if the model is local | Mission data stays on the kit |
| **Subscription harness** | A vendor agent client - Anthropic Claude (e.g. Claude Code / Agent SDK) or OpenAI Codex - pointed at the vendor API | Connected mode only (needs egress to the vendor) | Mission data leaves the kit; see [11-security.md](11-security.md) |
| **Team's private AI service** | The security team's own harness (e.g. a Pi Agent) pointed at their own private model endpoint | Per the team's network (VPN/[14](14-remote-replication-vpn.md)) | Governed by the team's own service |

In all three cases the harness is configured for the **Splunk MCP server** so it can
inspect indexes, run searches, and explain/optimize SPL against the kit's data. If the
security team owns a private AI service, it can be used the same way - point their harness
(such as a Pi Agent) at their private endpoint instead of a public vendor.

### Placement and integration

- `ai01` sits on the kit data VLAN ([03](03-network-design.md#ip-and-hostname-plan)) and
  reaches the search head / indexers over Splunk's REST/MCP interface (8089).
- The MCP server runs either on `ai01` or on a search head; the harness connects to it.
- Analysts interact with the harness directly (its own UI/CLI) or via SOAR actions.
- Install and configuration steps live in
  [05-splunk-deployment.md](05-splunk-deployment.md#ai-server-optional).

### Connectivity and data-sensitivity caution

The choice of harness is a **connectivity and data-classification decision**
([11-security.md](11-security.md#data-classification)):

- A **local** harness (Pi with a local model) is the only option that keeps mission data
  on the kit and works **air-gapped**.
- A **subscription** harness (Claude, Codex) requires egress to the vendor API - it is
  **connected mode only**, and sending mission data off-kit must be allowed by the
  mission's data-handling rules. Route any egress through the firewall with an explicit,
  logged allow rule ([06](06-offline-repo.md#connected-mode-policy)).
- A **private** team service keeps data within the team's control but still crosses the
  link to their endpoint - treat that link per [14](14-remote-replication-vpn.md) and
  [11](11-security.md).

> Hardware specs for `ai01` depend on the harness. A subscription or private
> remote service needs only a light client (any modern PC/laptop). A *local* model harness
> may need more RAM/VRAM than a plain laptop provides - size it to the chosen local model
> before committing it to the BOM ([02](02-hardware-bom.md)).

# 02 - Hardware Bill of Materials

Per-tier bill of materials for compute, storage, networking, power, and transport. All
model numbers are **references** - verify the current SKU, availability, and spec at time
of purchase. Quantities assume one spare is carried for critical single-point roles where
noted.

> Cisco Catalyst and Cisco Meraki are the reference networking
> brands and models here - but the kit is **vendor-agnostic**: every model below is "or similar," and
> an equivalent from another vendor that matches the port/speed/management posture is fine.
> Meraki (MX firewalls, cloud-managed switches) requires internet access to
> the Meraki dashboard and so is **connected-mode only** - see
> [03-network-design.md](03-network-design.md) and
> [14-remote-replication-vpn.md](14-remote-replication-vpn.md). For air-gapped missions,
> use locally-managed Catalyst switches and Cisco Secure Firewall.

## Compute reference specs

Match hosts to roles. These are minimums; more RAM/NVMe is always welcome on Search Heads and Indexers.

**Recommendation (Nov, 2026):**

Purchase the highest core/thread count CPUs possible per instance.  More CPU cores/threads reduce the need for clustering or reduce the number of cluster nodes/members.

For laptop instances:

- AMD Ryzen 8000/9000-series
- Intel Core-series

For desktop instances:

- AMD Ryzen 7000/9000-series or Ryzen Threadripper
- Intel Core Ultra-series or Xeon 600-seriesHigh-end Desktop (HEDT) CPUs are highly recommended or should be used for Medium to High volume deployment scenarios.

| Class | Role(s) | CPU | RAM | Storage | Notes |
| --- | --- | --- | --- | --- | --- |
| **Indexer desktop** | Indexer | 12+ physical cores | 32-64 GB | 2x NVMe (OS + data), size per [01 sizing](01-architecture.md#sizing-math) internal server-class SATA/SAS HDD for additional storage.  USB HDD/SSD/NVMe storage optional. | SFF/mini-tower; fast sustained write is the priority |
| **ES/search laptop/desktop** | ES SH, ad-hoc SH, Splunk MCP | 8+ cores | 64 GB | 1-2 TB NVMe | High RAM for data models / ES |
| **Management laptop** | CM/LM/DS/MC/DNS/DHCP/NTP | 8 cores | 32 GB | 1 TB NVMe | Battery = built-in UPS |
| **Ingest host** | HF, HEC, SC4S | 8 cores | 32 GB | 512 GB-1 TB NVMe | SC4S needs a container runtime |
| **SOAR desktop** | SOAR | 8+ cores | 64 GB | 1 TB+ NVMe | RHEL-family only; PostgreSQL 15 local; not containerized |
| **AI server** (optional) | AI harness + Splunk MCP | 4+ cores | 16 GB (more for a local model) | 256 GB-1 TB | Simple PC/laptop; a local-model harness may need more RAM/VRAM - see [01 AI server](01-architecture.md#ai-server-optional) |

Note:

Rugged/field notes: prefer business-class laptops with large batteries;
prefer desktops with tool-less drive bays and standard ATX/SFX power for field-replaceable
PSUs. Carry at least one cold spare indexer desktop in Medium/Large.

Backup power supply recommended for desktops.

Host-count note: running Splunk roles as containers
([07-containerization.md](07-containerization.md)) lets several roles share one physical
host, which can reduce the machine count below (especially the management laptops). The
per-role capacity (CPU/RAM/NVMe) is unchanged - containers consolidate hardware, they do
not shrink what each role needs.

## STORAGE

**Recommendation:**

###

- Use solid-state (SSD/NVMe) storage for the fastest, most reliable performance
- Hard drives (HDD) can be used for larger or longer deployments for slower, bulk storage
- Direct Attached Storage (DAS) with SAS, Thunderbolt, USB, etc. connections for bulk storage for Indexers
- Network Attached Storage (NAS) with minimum 1GbE (2.5GbE or greater recommended) network interfaces for bulk storage for Indexers

Splunk provides[ index tier storage](https://help.splunk.com/en/splunk-enterprise/administer/manage-indexers-and-indexer-clusters/10.6/manage-index-storage/configure-index-storage#d56c616c_422a_4bcc_9f6d_356f45faa863--en) per indexes based on timestamps of data, Hot, Warm, Cold buckets.

**<u>WARNING</u>:** Avoid Frozen bucket tier during active investigations, data is archived and not searchable!

Link: [Estimate indexer storage requirements](https://help.splunk.com/en/splunk-enterprise/get-started/deployment-capacity-manual/10.6/hardware-capacity-planning/estimate-your-storage-requirements)

Recommend to store at least the last 24 hours of data on SSD/NVMe.

## Networking

Bandwidth policy: **1 GbE minimum on every host, 10 GbE recommended** for indexers,
search heads, and the switch uplink/backbone. Indexer replication (port 9887) and
distributed search are the traffic that benefits most from 10 GbE.

### Switches (reference)

All models below are references - **or similar** equivalents are acceptable.

| Tier | Ports | Speed | Catalyst (or similar, local-managed) | Meraki (or similar, cloud-managed; connected only) |
|------|-------|-------|--------------------------------------|----------------------------------------------------|
| Small | 8-12 | 1 GbE min, mGig/10G preferred | Catalyst 1300 compact (e.g. C1300-12XT, 12x 10G copper) | MS130 compact (mGig/10G) |
| Medium | 16-24 | 10G | Catalyst 1300 24-port 10G (e.g. C1300-24XT) or Catalyst 9200CX | MS150 series |
| Large | 24-48 | 10G, 10/25G uplinks | Catalyst 9300X | MS390 / MS450-class |

- **Or similar.** These models are references; the kit is vendor-agnostic. Any managed
  switch meeting the port count, speed, and management posture for the tier is acceptable
  (for example, Aruba/HPE, Juniper, Netgear/MikroTik business lines).
- Catalyst 1300 / 9200 / 9300 (or similar locally-managed switches) work air-gapped via
  web UI / CLI.
- Meraki switches (or any cloud-managed switch) need the cloud dashboard - list them only
  for connected missions.
- Carry a spare small unmanaged 5-8 port 1G switch as a field backup.

### Firewall (reference)

Optional in Small, recommended in Medium/Large.

| Option | Model reference | Management | Air-gap? | Site-to-site VPN |
|--------|-----------------|------------|----------|------------------|
| **Cisco Secure Firewall (default)** | 1200 series, e.g. 1210, or similar | Local (FDM) or optional cloud (CDO) | Yes (FDM local) | IPsec |
| Cisco Meraki MX, or similar | MX67 / MX75 / MX85 | Cloud dashboard (required) | No | Auto VPN + IPsec |

**Or similar.** A locally-managed firewall from another vendor (for example,
pfSense/OPNsense, Fortinet, Palo Alto) is acceptable as long as it supports local
management for air-gap and standards-based site-to-site IPsec. The deciding factor is
local vs. cloud management, not the brand.

Secure Firewall 1200 with local FDM is the default because it works disconnected. Use
Meraki MX only when the mission is connected and the remote end is also Meraki (Auto VPN
simplifies site-to-site).

### Cabling and transit networking

- Cat6a patch cables (10G-rated), one per host plus 25% spares, pre-labeled to the IP
  plan hostnames.
- SFP+/SFP28 transceivers and DAC/fiber as required by the chosen switch uplinks.
- A small labeled cable pouch; color-code by VLAN (see [03](03-network-design.md)).
- Optional: cellular/5G modem or BGAN/satellite terminal for connected mode at remote
  sites (feeds the firewall WAN).

## Power

- **UPS:** at least one UPS sized to the desktop + switch + firewall load for clean
shutdown (laptops self-protect on battery). ~1000-1500 VA covers Small/Medium desktop
counts; size Large to measured load.
- **PDU:** a rugged surge-protected PDU with enough outlets for all desktops, switch,
firewall, UPS, and chargers.
- **Input:** carry IEC cables plus region adapters; note voltage range (auto-ranging
PSUs preferred for 100-240 V missions).
- A generator or large-capacity portable power station is a mission-dependent add-on for
truly off-grid tactical use.

### Power budget (planning estimate)

Steady-state draw; measure actual on the bench before the mission.

| Item | Watts each | Small qty | Medium qty | Large qty |
|------|-----------|-----------|------------|-----------|
| Indexer desktop | ~150-250 | 1-2 | 3 | 4-6 |
| Laptop (SH/mgmt/ingest) | ~60-90 | 3 | 5 | 7 |
| SOAR desktop | ~150-250 | 0-1 | 1 | 1 |
| AI server (optional) | ~60-90 (PC/laptop); more if running a local GPU model | 0-1 | 0-1 | 0-1 |
| Switch | ~30-150 | 1 | 1 | 1 |
| Firewall | ~30-60 | 0-1 | 1 | 1 |
| **Approx total** | | **~0.6-1.0 kW** | **~1.5-2.2 kW** | **~2.5-4+ kW** |

The AI server is optional and, as a plain PC/laptop running a harness, draws about as much
as the other laptops. If a *local* GPU model is chosen instead, re-cost its power when the
spec is set ([01 AI server](01-architecture.md#ai-server-optional)).

## Transport / cases

- Rugged wheeled cases with custom foam (Pelican-class) sized per tier; keep total
  per-case weight within what one person can lift (~20-23 kg) and within airline/freight
  limits.
- Separate the "compute" case(s) from the "network + power" case for faster setup.
- Include: labeled cables, spare drives, the offline media
  ([06-offline-repo.md](06-offline-repo.md)) on at least two separate drives, printed
  runbooks and checklists ([appendix-checklists.md](appendix-checklists.md)), and a small
  tool/label kit.

### Weight budget (planning estimate)

| Tier | Compute | Network + power | Approx total |
|------|---------|-----------------|--------------|
| Small | ~15-20 kg | ~10-15 kg | ~25-35 kg (2 cases) |
| Medium | ~30-40 kg | ~15-20 kg | ~45-60 kg (3-4 cases) |
| Large | ~55-75 kg | ~20-30 kg | ~75-105 kg (5+ cases) |

- 1-2 indexer desktops, 1 management laptop, 1 ES/search laptop, 1 ingest host
- Optional 1 SOAR desktop

# 03 - Network Design

The kit ships with its own self-contained network so it behaves identically every
deployment regardless of the site. This document defines the switch choice, bandwidth
policy, VLAN layout, the fixed IP/hostname plan, the Splunk ports matrix, the kit's
DNS/DHCP/NTP services, and the firewall policy.

## Bandwidth policy

- **1 GbE minimum** on every host.
- **10 GbE recommended** for indexers, search heads, and the switch backbone/uplink.
- The traffic that most needs 10 GbE: indexer-to-indexer **replication (9887)** in a
  cluster, bulk **forwarding (9997)** during a burst/backfill, and distributed search
  fan-out from the ES search head.

See [02-hardware-bom.md](02-hardware-bom.md#switches-reference) for the switch SKUs per
tier (Catalyst for air-gap, Meraki for connected-only).

## VLAN layout

A small set of VLANs keeps management, data, site traffic, and VPN transit separated.
For the Small tier a single flat VLAN is acceptable; Medium/Large should segment.

| VLAN | Name | Purpose | Example subnet |
|------|------|---------|----------------|
| 10 | mgmt | Out-of-band/host mgmt, IPMI, switch/firewall mgmt | 10.73.10.0/24 |
| 20 | data | Splunk data plane: forwarding, replication, search | 10.73.20.0/24 |
| 30 | site | Site-facing ingest interface(s) toward the org network | 10.73.30.0/24 |
| 40 | vpn | VPN transit to remote DC/cloud / Headscale | 10.73.40.0/24 |
| 50 | wifi | Optional operator/analyst Wi-Fi access (opt-in, off by default) | 10.73.50.0/24 |

Notes:
- The data VLAN (20) carries the bulk of traffic - put the 10 GbE here.
- The site VLAN (30) is the only one that touches the organization's network and only via
  the firewall or a dual-homed heavy forwarder (see [13-site-integration.md](13-site-integration.md)).
- Color-code patch cables by VLAN and label both ends to the hostnames below.

## IP and hostname plan

Fixed addressing on the data VLAN so configs, DNS, and runbooks never change between
missions. The example uses `10.73.20.0/24` with domain `kit.local`.

> The `10.73.x.x` range is chosen to avoid the very common `10.0.x`, `192.168.0/1.x`, and
> `172.16.x` ranges that organizations use, reducing the chance of a clash when the kit
> joins a site. If it still clashes, re-address the data VLAN once and update DNS + the
> few config files that pin IPs (CM `server.conf`, `outputs.conf`, LM URI).

| Hostname | Role | Data VLAN IP | Present in |
|----------|------|--------------|-----------|
| mgmt01.kit.local | CM+LM+MC (S: +DS+DNS/DHCP/NTP) | 10.73.20.11 | all |
| mgmt02.kit.local | DS (+Deployer, DNS/DHCP/NTP) | 10.73.20.12 | M/L |
| es01.kit.local | ES search head (SHC member) | 10.73.20.21 | all |
| es02.kit.local | ES SHC member | 10.73.20.22 | L |
| es03.kit.local | ES SHC member | 10.73.20.23 | L |
| sh01.kit.local | Ad-hoc search head | 10.73.20.29 | M (opt) |
| idx01.kit.local | Indexer | 10.73.20.31 | all |
| idx02.kit.local | Indexer | 10.73.20.32 | S(opt)/M/L |
| idx03.kit.local | Indexer | 10.73.20.33 | M/L |
| idx04-06.kit.local | Indexer | 10.73.20.34-36 | L |
| hf01.kit.local | Heavy forwarder + HEC | 10.73.20.41 | all |
| hf02.kit.local | Heavy forwarder + HEC | 10.73.20.42 | L |
| sc4s01.kit.local | SC4S syslog | 10.73.20.45 | M/L (S: on hf01) |
| soar01.kit.local | SOAR | 10.73.20.51 | S(opt)/M/L |
| ai01.kit.local | AI server (optional) | 10.73.20.61 | opt (any tier) |
| sw01 / fw01 | Switch / firewall mgmt | 10.73.10.2 / 10.73.10.1 | mgmt VLAN |
| ap01.kit.local | Wi-Fi access point (optional) | 10.73.10.3 | opt (mgmt VLAN) |

Reserve `10.73.20.100-199` in DHCP for transient clients (analyst workstations, a
site-provided forwarder under test). Everything in the table is static.

## Splunk ports matrix

Splunk default ports (all configurable; these are the defaults the runbooks assume).
Open these **within the kit LAN**; the subset that must be opened on the org firewall for
ingestion is in [13-site-integration.md](13-site-integration.md).

| Port | Proto | Service | Direction / who | 
|------|-------|---------|-----------------|
| 8000 | TCP | Splunk Web (HTTPS) | Analysts -> SH/MC |
| 8089 | TCP | splunkd management/REST | All Splunk <-> all Splunk (CM, LM, DS, deployer, MC, peers) |
| 9997 | TCP | Forwarder receiving | Forwarders/HF -> indexers |
| 9887 | TCP | Indexer cluster replication | Indexer <-> indexer (cluster only) |
| 8088 | TCP | HTTP Event Collector (HEC) | Sources -> HF/indexers |
| 8065 | TCP | App server (internal) | Local on SH |
| 8191 | TCP | KV store (mongod) | SH / SHC members |
| 8181 | TCP | SHC replication port (example; admin-chosen) | ES SHC members (L) |
| 514 | UDP/TCP | Syslog in (to SC4S) | Devices -> SC4S |
| 6514 | TCP | Syslog over TLS (to SC4S) | Devices -> SC4S |
| 123 | UDP | NTP | All hosts -> mgmt (chrony) |
| 53 | UDP/TCP | DNS | All hosts -> mgmt |
| 67/68 | UDP | DHCP (kit LAN only) | Transient clients -> mgmt |

SOAR ports:

| Port | Proto | Service |
|------|-------|---------|
| 443 | TCP | SOAR web UI / REST |
| 5432 | TCP | PostgreSQL 15 (SOAR internal; local unless clustered) |
| 9200/9300 | TCP | Elasticsearch (SOAR internal) |
| GlusterFS ports | TCP | SOAR cluster file shares (clustered SOAR only) |

## Kit services: DNS, DHCP, NTP

Hosted on the management node (`mgmt01` in Small; `mgmt02` in Medium/Large).

- **DNS** - authoritative for `kit.local` with forward and reverse zones matching the IP
  plan. In air-gapped mode it is the only resolver; in connected mode it forwards unknown
  queries upstream (or to the firewall). Every host uses `kit.local` names, never raw IPs,
  so re-addressing touches one zone file.
- **DHCP** - serves only the reserved transient range on the data VLAN; all infrastructure
  hosts are static. Keeps a rogue DHCP server off the org network - the kit's DHCP must
  **not** be bridged onto the site VLAN.
- **NTP (chrony)** - the kit's authoritative time source. Correct time is critical:
  Splunk indexes events by timestamp, cluster/SHC elections and TLS cert validation all
  depend on agreed time, and skew corrupts correlation. When connected, chrony disciplines
  to an upstream/GPS source; when air-gapped it free-runs from `mgmt` (optionally a small
  GPS/PPS dongle for drift control on long missions).

> Note:
>
> Air-gapped chrony free-running from one host drifts over long deployments.
> Ceiling: clock drift on multi-week missions. Upgrade path: add a GPS/PPS time source on
> the mgmt node.

## Firewall policy

The firewall (Cisco Secure Firewall 1210 default, or similar locally-managed firewall;
Meraki MX or similar cloud-managed firewall is connected-only) sits between
the kit LAN and both the site VLAN and any VPN transit.

Default stance - **deny all, allow by exception**:

- **Kit LAN internal** - permit the ports matrix above between kit hosts (ideally
  switch-enforced within the data VLAN; the firewall governs inter-VLAN).
- **Site VLAN (ingestion)** - permit only the specific ingest ports inbound from the
  org's sources to the kit's HF/HEC/SC4S (9997, 8088, 514/6514), and only the specific
  egress the kit needs (e.g. UF pull of apps). Enumerated in
  [13-site-integration.md](13-site-integration.md).
- **VPN transit** - permit only IPsec (IKE/UDP 500, NAT-T/UDP 4500, ESP) or Headscale
  WireGuard (UDP 41641 + the Headscale control port) to the specific remote peer. See
  [14-remote-replication-vpn.md](14-remote-replication-vpn.md).
- **Wi-Fi VLAN (optional)** - if Wi-Fi is enabled, permit wireless clients to reach only
  Splunk Web (8000) on the search head/MC; deny the rest of the data plane. See
  [Wi-Fi access](#wi-fi-access-optional).
- **Management** - restrict switch/firewall admin to the mgmt VLAN only.
- Log denies; export firewall logs into Splunk as a data source.

```mermaid
flowchart LR
    subgraph site [Site VLAN 30]
        src[OrgSources]
    end
    subgraph vpn [VPN VLAN 40]
        peer[RemotePeer]
    end
    src -->|"9997/8088/514"| fw[Firewall]
    peer <-->|"IPsec / WireGuard"| fw
    subgraph data [Data VLAN 20]
        idx[Indexers]
        sh[SearchHeads]
        ing[Ingest]
    end
    fw --> ing
    ing --> idx
    sh --> idx
    mgmtVlan["Mgmt VLAN 10: switch/fw admin"] -.-> fw
```

## Wi-Fi access (optional)

The kit is wired-first. Wi-Fi is **opt-in** and should stay **off for air-gapped and
high-sensitivity missions** - a wireless radio is extra attack surface and can trip a
site's wireless IDS. Enable it only when operators genuinely need cable-free access to
Splunk Web in the field, and treat it as untrusted transit, not part of the trusted data
plane.

When Wi-Fi is used:

- **Dedicated AP on its own VLAN.** Use a dedicated access point (Meraki MR-series or a
  Catalyst 9100-series AP, or similar) on the `wifi` VLAN (50). For air-gapped missions the
  AP must be locally manageable - cloud-managed Meraki APs need egress, so use an
  embedded/Catalyst AP in air-gap, the same split as the switches in
  [02-hardware-bom.md](02-hardware-bom.md#switches-reference).
- **Scope it to Splunk Web only.** Firewall the Wi-Fi VLAN so wireless clients reach only
  port 8000 on the search head/MC - never the forwarding (9997), replication (9887), HEC,
  or management (8089) ports. Analysts browse; they do not join the data plane.
- **WPA3, 802.1X preferred.** Use WPA3-Enterprise (802.1X) backed by the kit's own RADIUS
  where feasible, so each operator has an individual credential that can be revoked. If
  Enterprise auth is impractical in the field, use WPA3-Personal (SAE) with a long, random,
  per-mission passphrase. Never Open, WEP, WPA/TKIP, or WPS.
- **Protected Management Frames (PMF / 802.11w) required**, and enable **client isolation**
  so wireless clients cannot reach each other.
- **Do not bridge Wi-Fi to the site VLAN**, and do not let the kit act as a rogue AP on the
  org's premises - coordinate SSID/channel/power with the site so the kit does not interfere
  with or trip the org's wireless monitoring.
- **Lock down management.** Restrict AP admin to the mgmt VLAN, change default credentials,
  and limit TX power to the immediate work area to reduce signal leakage. A hidden SSID and
  a MAC allowlist are weak defense-in-depth only - not a substitute for WPA3 + 802.1X.
- **Rotate and wipe.** Rotate the passphrase/keys every mission, forward AP
  authentication/association events into Splunk as a data source, and wipe the AP
  configuration at teardown with the rest of the kit
  ([10-runbook-teardown.md](10-runbook-teardown.md#phase-4--secure-wipe),
  [11-security.md](11-security.md)).

> `ponytail:` Wi-Fi is deliberately a thin, scoped add-on (browse-only, one VLAN). The
> ceiling is that it is not meant to carry forwarding/replication traffic. Upgrade path: if
> a mission needs wireless data collection, design a separate hardened WLAN with its own
> risk review rather than widening this one.

</script>
<script type="text/markdown" data-id="04-os-baseline" data-title="04 - OS Baseline" data-group="Build" data-file="docs/04-os-baseline.md">
# 04 - OS Baseline

The Linux build standard every kit host is imaged to before Splunk is installed. A single
consistent baseline makes the deployment runbook deterministic and the configs portable.

## OS choice

| Role | Primary OS | Alternative | Why |
|------|-----------|-------------|-----|
| Splunk Enterprise (indexer, SH, mgmt, HF) | Rocky Linux 9 / RHEL 9 | Ubuntu 24.04 LTS | Both are supported by Splunk Enterprise 10.6 |
| SOAR | Rocky Linux 9.7+ / RHEL 9.7+ (or Oracle Linux 9) | - | **SOAR does not support Ubuntu**; see below |
| SC4S ingest host | Rocky/RHEL 9 or Ubuntu 24.04 | - | Needs a container runtime (Podman/Docker) |
| Containerized Splunk roles (optional) | Rocky/RHEL 9 or Ubuntu 24.04 | - | Host runs Podman/Docker; see [07-containerization.md](07-containerization.md). SOAR is the exception - it cannot be containerized |

Standardizing on **Rocky Linux 9 / RHEL 9 across the whole kit** is the recommended path:
it is the one OS that satisfies every role (including SOAR), which keeps the offline repo,
the hardening, and the runbooks single-track. Ubuntu is listed only as a fallback for
non-SOAR hosts if RHEL-family media is unavailable.

### SOAR OS constraints (verified against Splunk docs)

Splunk SOAR (On-premises) 8.7 supported operating systems:

- Red Hat Enterprise Linux 8 (8.10+) or 9 (9.7+)
- Oracle Linux 8 (8.10+) or 9 (9.7+)
- Amazon Linux 2023 (2023.10.x+)

Hard constraints:

- **Not Ubuntu / Debian.** Do not plan SOAR on Ubuntu.
- **Cannot be installed inside a Docker or Podman container.** SOAR runs on the host.
- Bundles **PostgreSQL 15**, Elasticsearch, and (for clustered SOAR) **GlusterFS** file
  shares. The installer expects **umask 0022**.
- Installs as the unprivileged `phantom` user into `/opt/phantom` (`<$PHANTOM_HOME>`).
- Uses Splunk Universal Forwarder 10.4.1 internally.
- Can run FIPS-compliant only if the OS kernel is in FIPS mode and it is a fresh
  unprivileged install.
- If `fapolicyd` is enabled on RHEL, stop it for install, then allow-list SOAR and
  restart it.

## Disk layout

NVMe, GPT, UEFI. Separate OS from Splunk data so a full data volume never takes down the
OS, and so teardown wipe targets the data volume directly.

| Mount | Size | Notes |
|-------|------|-------|
| `/boot/efi` | 1 GB | ESP |
| `/boot` | 1 GB | |
| `/` | 50-80 GB | OS |
| `/var` | 20 GB | separate so logs can't fill `/` |
| `/opt/splunk` | 50-100 GB | Splunk install + `var/log/splunk` (indexers: hot/warm goes on the data volume below) |
| `/opt/splunk/var/lib/splunk` (indexers) | remainder of data NVMe | hot/warm index storage; size per [01 sizing](01-architecture.md#sizing-math) |
| swap | per RAM / disable | Splunk prefers little/no swapping |

SOAR hosts: give `/opt/phantom` the large volume; keep `/home` and `/tmp` writable as the
docs require.

## OS tuning for Splunk

Apply on every Splunk host. These are the long-standing Splunk prerequisites.

- **Transparent Huge Pages (THP): disabled.** THP hurts Splunk performance. Disable via
  kernel cmdline or a `tuned`/systemd unit and verify at boot.
- **ulimits** for the `splunk` user (`/etc/security/limits.d/`):
  - `nofile` (open files) >= 64000
  - `nproc` (user processes) >= 16000
  - `fsize` (max file size) unlimited
  - `data`/`memory` unlimited
- **Time sync:** chrony enabled, pointed at the kit NTP source
  ([03-network-design.md](03-network-design.md)). No host free-runs independently.
- **Disable unnecessary services;** keep the box minimal.
- **I/O scheduler:** `none`/`mq-deadline` for NVMe.

## Accounts and service management

- Dedicated unprivileged **`splunk`** OS user and group; Splunk installed to
  `/opt/splunk` owned by `splunk`.
- Splunk runs as a **systemd** service (`systemctl enable --now Splunkd`) using
  `enable boot-start -user splunk -systemd-managed 1`, so hosts come back cleanly after
  a power event - important in the field.
- SOAR runs as the **`phantom`** user per its installer; managed by its own units.
- No shared logins; per-operator accounts; sudo logged (see [11-security.md](11-security.md)).

## Firewall and SELinux

- **firewalld** enabled on every host, default-deny, opening only that host's required
  ports from the matrix in [03-network-design.md](03-network-design.md). Example for an
  indexer: allow 8089, 9997, 9887 from the data VLAN only.
- **SELinux: enforcing.** Splunk Enterprise runs under enforcing SELinux. If a specific
  input or path needs a policy exception, document the exact `semanage`/`setsebool` rule
  in the host's build notes rather than disabling SELinux. (SOAR documents its own
  SELinux/`fapolicyd` handling above.)

## Build output

Each imaged host should end at a known state before Splunk install:

1. OS installed to the disk layout above, UEFI, hostname + static IP per the plan.
2. THP off, ulimits set, chrony synced, I/O scheduler set.
3. `splunk` (and `phantom` on SOAR) user created; `/opt/splunk` volume mounted.
4. firewalld + SELinux enforcing with the host's port set open.
5. Registered in kit DNS; reachable by name from `mgmt`.

> Automation hook (out of scope): this baseline is the natural target for a kickstart /
> autoinstall file plus an Ansible hardening role. The doc is written so each step maps
> 1:1 to a future task.

A quick post-build self-check is in
[appendix-checklists.md](appendix-checklists.md#os-baseline-self-check-per-host).

</script>
<script type="text/markdown" data-id="05-splunk-deployment" data-title="05 - Splunk Deployment" data-group="Build" data-file="docs/05-splunk-deployment.md">
# 05 - Splunk Deployment

Per-tier install order and role configuration for Splunk Enterprise 10.6, Enterprise
Security, and SOAR 8.7. Config snippets are copy-paste starting points - set them in app
context (e.g. `$SPLUNK_HOME/etc/apps/kit_base/local/`) where practical, not in
`system/local`, so they travel with the kit's base app.

All hostnames/IPs/ports refer to [03-network-design.md](03-network-design.md). Licensing,
clustering secrets, and TLS are covered in [11-security.md](11-security.md).

This document covers the bare-metal install. Any role except SOAR can instead run as a
Docker/Podman container for faster deployment and host consolidation - see
[07-containerization.md](07-containerization.md). The two styles mix freely within one kit.

## Install order (all tiers)

Order matters so each role can register with its manager as it comes up:

1. **License manager (LM)** - so every other instance can point its license at it.
2. **Cluster manager (CM)** - Small/Medium/Large, before indexers.
3. **Indexers** - join the cluster (S/M/L) or come up standalone (S).
4. **Deployment server (DS)** - before forwarders/HF so they pull apps.
5. **Search heads** (ES, ad-hoc) / **ES SH cluster + deployer** (L).
6. **Monitoring console (MC)** - last, so it discovers a complete topology.
7. **Ingest**: HF, HEC, SC4S.
8. **SOAR**, then the optional **AI server**.

## Licensing

Point every instance at the LM. On the LM, install the license; on peers:

```ini
# $SPLUNK_HOME/etc/system/local/server.conf  (on each non-LM instance)
[license]
manager_uri = https://mgmt01.kit.local:8089
```

Carry the license file on the offline media ([06-offline-repo.md](06-offline-repo.md)).
For disconnected missions confirm the license terms allow offline operation; the
no-enforcement grace behavior should be understood before you rely on it.

## Management roles and colocation

Follow the colocation rules in
[01-architecture.md](01-architecture.md#management-role-colocation). The critical one:
**the cluster manager must not share a host with the deployment server, an indexer, or a
search head.**

- **Small (no cluster):** `mgmt01` = LM + DS + MC + DNS/DHCP/NTP. MC-on-DS is supported
  because deployment clients are far under 50.
- **Medium/Large (clustered):** `mgmt01` = CM + LM + MC; `mgmt02` = DS (+ ES SHC deployer
  on Large) + DNS/DHCP/NTP. This keeps CM away from DS.

## Indexers

### Standalone (Small)

Enable receiving and define indexes. No cluster config.

```ini
# inputs.conf - receive from forwarders
[splunktcp://9997]
```

```ini
# indexes.conf - mission indexes (example)
[mission_wineventlog]
homePath   = $SPLUNK_DB/mission_wineventlog/db
coldPath   = $SPLUNK_DB/mission_wineventlog/colddb
thawedPath = $SPLUNK_DB/mission_wineventlog/thaweddb
maxTotalDataSizeMB = 512000
frozenTimePeriodInSecs = 2592000   # 30 days; tune per retention
```

### Clustered (Medium/Large)

On the **CM** (`mgmt01`):

```ini
# server.conf
[clustering]
mode = manager
replication_factor = 2
search_factor = 2
pass4SymmKey = <cluster-secret>     # same on CM and all peers; see 11-security.md
cluster_label = flyaway

[license]
manager_uri = https://mgmt01.kit.local:8089   # LM is local on mgmt01
```

On each **peer/indexer**:

```ini
# server.conf
[replication_port://9887]

[clustering]
mode = peer
manager_uri = https://mgmt01.kit.local:8089
pass4SymmKey = <cluster-secret>
cluster_label = flyaway
```

```ini
# inputs.conf
[splunktcp://9997]
```

Push indexes to peers from the CM as the cluster bundle
(`$SPLUNK_HOME/etc/manager-apps/`) rather than editing peers directly:

```ini
# manager-apps/kit_indexes/local/indexes.conf  (replicated to all peers)
[mission_wineventlog]
homePath   = $SPLUNK_DB/mission_wineventlog/db
coldPath   = $SPLUNK_DB/mission_wineventlog/colddb
thawedPath = $SPLUNK_DB/mission_wineventlog/thaweddb
repFactor  = auto
frozenTimePeriodInSecs = 2592000
```

Apply with `splunk apply cluster-bundle` on the CM. Confirm the cluster is complete
(`splunk show cluster-status`) before ingesting.

## Search heads

### ES search head (all tiers)

Dedicated host. Add the indexers as search peers (standalone) or configure as a cluster
search head (clustered). Clustered:

```ini
# server.conf on the ES SH
[clustering]
mode = searchhead
manager_uri = https://mgmt01.kit.local:8089
pass4SymmKey = <cluster-secret>
```

Install Enterprise Security (see [ES integration](#enterprise-security-integration)).

### ES search head cluster (Large)

An odd number of members (3) plus a deployer (on `mgmt02`). Initialize each member and the
captain:

```ini
# server.conf on each SHC member
[shclustering]
conf_deploy_fetch_url = https://mgmt02.kit.local:8089
pass4SymmKey = <shc-secret>
shcluster_label = flyaway_shc
replication_factor = 2
```

Then bootstrap the captain (`splunk bootstrap shcluster-captain ...`). Deploy ES and apps
from the deployer with `splunk apply shcluster-bundle`. ES on an SHC has extra steps -
follow the ES install guide for SHC and install ES on the deployer first.

### Ad-hoc search head (Medium, optional)

Same cluster-search-head config as ES SH, without ES. For hunting/dashboards so analysts
don't add load to the ES SH.

## Deployment server (forwarder management)

The DS pushes TAs/apps to UFs and HFs via serverclasses. Define classes by data source so
the Flyaway Kit app concept ([15-flyaway-kit-app-concept.md](15-flyaway-kit-app-concept.md))
can map a checked source to a serverclass.

```ini
# serverclass.conf on the DS (mgmt01 in S, mgmt02 in M/L)
[serverClass:all_forwarders]
whitelist.0 = *

[serverClass:all_forwarders:app:Splunk_TA_windows]
restartSplunkd = true

[serverClass:syslog_sources:app:Splunk_TA_nix]
whitelist.0 = *linux*
```

Clients point at the DS:

```ini
# deploymentclient.conf on each UF/HF
[deployment-client]
[target-broker:deploymentServer]
targetUri = mgmt02.kit.local:8089   # mgmt01 in Small
```

## Ingest tier

### Forwarder output (UF/HF -> indexers)

Standalone indexers - list them directly; clustered - also list all peers (indexer
discovery via the CM is the cleaner option for clusters):

```ini
# outputs.conf on UF/HF
[tcpout]
defaultGroup = kit_idx

[tcpout:kit_idx]
server = idx01.kit.local:9997, idx02.kit.local:9997, idx03.kit.local:9997
# clustered alternative - indexer discovery:
# [indexer_discovery:kit]
# manager_uri = https://mgmt01.kit.local:8089
```

### HEC (on hf01/indexers)

```ini
# inputs.conf
[http]
disabled = 0
port = 8088
enableSSL = 1

[http://mission_app]
token = <generated-token>
index = mission_app
sourcetype = mission:app
```

Manage tokens from the mgmt/token admin; carry no plaintext tokens in the repo.

### SC4S (syslog)

SC4S is Splunk's supported containerized syslog collector. On `sc4s01` (or `hf01` in
Small) run the SC4S container (Podman/Docker), listening on 514/UDP-TCP and 6514/TLS, and
forwarding to the indexers via the same `kit_idx` output group over HEC or splunktcp.
Point network/security devices at `sc4s01`'s site-VLAN address
([13-site-integration.md](13-site-integration.md)).

## Monitoring console

Bring the MC up last on `mgmt01`, set it to distributed mode, and add all instances as
search peers so the whole kit is visible in one place. Respect the colocation rules: in a
clustered kit the MC lives with the CM/LM on `mgmt01`, never on an indexer.

## Enterprise Security integration

- Install ES on the dedicated ES SH (or on the deployer first for an SHC).
- Confirm the ES version is compatible with Splunk Enterprise 10.6 before the mission -
  pin both in the manifest.
- Map mission indexes into the ES/CIM data models so correlation searches and dashboards
  populate. The Flyaway Kit app concept tracks CIM coverage per onboarded source.
- Accelerate the data models you actually use; on a kit, disable the ones you don't to
  save indexer CPU.

## SOAR deployment

- Install on a RHEL-family host only ([04-os-baseline.md](04-os-baseline.md#soar-os-constraints-verified-against-splunk-docs)).
  Not on Ubuntu, not in a container.
- Unprivileged install as `phantom` into `/opt/phantom`, umask 0022.
- Connect SOAR to Splunk: configure the Splunk asset in SOAR pointing at the ES SH
  (REST/8089) and configure ES/SOAR to send notables to SOAR for playbook automation.
- Keep playbooks and custom apps on the offline media; load them during deployment.

## AI server (optional)

See [01-architecture.md](01-architecture.md#ai-server-optional) for the concept. `ai01` is
a simple PC/laptop running an AI harness connected to the Splunk MCP server.

1. **Stand up the Splunk MCP server** on `ai01` (or on the search head) and point it at the
   ES SH / indexers over REST (8089). Scope its Splunk credentials to a read-oriented role.
2. **Install the chosen harness** on `ai01`:
   - *Local harness (e.g. Pi)* - carry its installer and local model on the offline media
     ([06](06-offline-repo.md)); works air-gapped.
   - *Subscription harness (Claude / Codex)* - install the vendor client and configure its
     API key; requires firewall egress to the vendor (connected mode only).
   - *Team's private AI service* - install the team's harness (e.g. a Pi Agent) and point
     it at their private endpoint, reached per [14](14-remote-replication-vpn.md).
3. **Register the MCP server with the harness** so the agent can list indexes, run
   searches, and explain/optimize SPL against kit data.
4. **Integrate** for analysts: use the harness directly, or invoke it from SOAR actions.
5. Confirm the data-handling posture is allowed for the mission before sending any mission
   data to a non-local harness ([11](11-security.md#data-classification)).

## Validation

After install, before declaring the kit operational, run the checks in
[08-runbook-deploy.md](08-runbook-deploy.md#phase-6--validation) and
[appendix-checklists.md](appendix-checklists.md). Minimum: cluster complete, ES SH sees
all peers, a test event via each ingest path is searchable, MC shows all instances green.

</script>
<script type="text/markdown" data-id="06-offline-repo" data-title="06 - Offline Repo &amp; Air-gap" data-group="Build" data-file="docs/06-offline-repo.md">
# 06 - Offline Repository and Connected-Mode Policy

The kit must deploy fully air-gapped, which means every bit needed to build and run it is
carried on offline media. This document defines what that media contains, how it is built
and refreshed at base before a mission, how integrity is verified on site, and the policy
for when the kit is allowed online.

## Offline media layout

Carry the repository on **at least two independent drives** (primary + backup), stored in
separate cases. Encrypted at rest (see [11-security.md](11-security.md)).

```
flyaway-media/
  MANIFEST.yaml            # single source of truth: versions, checksums, build date
  CHECKSUMS.sha256         # sha256 of every artifact
  os/
    rocky-9-dvd.iso        # OS install media (and Ubuntu alt if used)
    packages/              # offline dnf repo mirror for OS deps
  splunk/
    splunk-enterprise-10.6-*.rpm
    splunkforwarder-10.x-*.rpm
    splunk-es-<ver>.spl
  soar/
    splunk-soar-onprem-8.7-*.tgz
  apps-tas/
    Splunk_TA_windows/ Splunk_TA_nix/ Splunk_TA_<vendor>/ ...
  sc4s/
    sc4s-<ver>.container   # SC4S image tarball for offline load
  images/                  # optional: docker/podman save tarballs (splunk/splunk, UF, mgmt tools)
    splunk-splunk-10.6.tar # see 07-containerization.md
  licenses/
    splunk-enterprise.lic
  configs/
    kit_base/              # base app: outputs, indexes, serverclasses templates
  vpn/
    headscale-<ver>/       # if Headscale carried (see doc 13)
  docs/                    # a copy of this repo's rendered docs + checklists
```

## MANIFEST.yaml

The manifest is the authoritative record of exactly what this kit build contains. Pin
every version; nothing is "latest".

```yaml
kit_build: 2026-11-18
tier_target: medium
software:
  splunk_enterprise: "10.6.x"      # exact build
  universal_forwarder: "10.x.x"
  enterprise_security: "<ver>"
  soar: "8.7.x"
  sc4s: "<ver>"
os:
  primary: "Rocky Linux 9.x"
  alt: "Ubuntu 24.04.x"
apps_tas:
  - {name: Splunk_TA_windows, version: "<ver>"}
  - {name: Splunk_TA_nix, version: "<ver>"}
license:
  file: licenses/splunk-enterprise.lic
  expires: "<date>"
checksums: CHECKSUMS.sha256
```

Keep `MANIFEST.yaml` in version control (this repo) so each mission's build is auditable,
and so the BOM/manifest could later be generated from it (noted in
[02-hardware-bom.md](02-hardware-bom.md)).

## Building / refreshing at base (connected)

Done at home base where internet is available, before deployment:

1. Download the pinned Splunk Enterprise, UF, ES, SOAR, and SC4S artifacts; download the
   OS ISO.
2. Mirror the OS package repo for offline `dnf` (so hardening/deps install with no
   internet). For RHEL-family: `reposync` the needed repos into `os/packages/`.
3. Collect the required TAs/apps from Splunkbase at pinned versions into `apps-tas/`.
4. Place the license in `licenses/`.
5. Generate checksums: `sha256sum` every artifact into `CHECKSUMS.sha256`.
6. Update `MANIFEST.yaml` with versions, dates, and license expiry.
7. Write to both media drives; verify each drive against `CHECKSUMS.sha256`.
8. Record the refresh in the pre-departure checklist
   ([appendix-checklists.md](appendix-checklists.md)).

Refresh cadence: before every mission, and whenever a security patch or license renewal
lands. License expiry is a go/no-go item - check it at pack time, not on site.

## Verifying on site (air-gapped)

Before installing anything, verify integrity so a corrupted or tampered drive is caught
early:

```bash
cd flyaway-media
sha256sum -c CHECKSUMS.sha256
```

All lines must report `OK`. If the primary drive fails, switch to the backup drive and
note the failure in the mission report. Set up the OS offline repo by pointing `dnf` at
`os/packages/` (a local `.repo` file), then proceed with
[04-os-baseline.md](04-os-baseline.md) and [05-splunk-deployment.md](05-splunk-deployment.md).

## Connected-mode policy

When a mission has internet, online access is **opt-in and controlled**, never the
default. The air-gapped path is always the primary path so behavior is identical whether
or not a link exists.

| Activity | Air-gapped | Connected (allowed if approved) |
|----------|-----------|----------------------------------|
| OS / Splunk install | Offline media only | Offline media only (do not pull "latest" mid-mission) |
| Security patches | Carried on media | May pull **pinned** patches through the firewall to a staging host, re-checksum, then deploy |
| App/TA updates | Carried on media | Pinned downloads only, via firewall, logged |
| License | File on media | File on media (online activation only if the mission explicitly allows) |
| Remote replication | n/a | Per [14-remote-replication-vpn.md](14-remote-replication-vpn.md) |
| Time sync | chrony free-run / GPS | chrony to approved upstream |

Rules:

- No kit host reaches the internet directly; any egress is through the firewall with an
  explicit allow rule and is logged.
- Nothing installed mid-mission bypasses the checksum/manifest discipline: download to a
  staging area, verify, update the manifest, then deploy.
- Meraki-managed gear (if carried) inherently needs the cloud dashboard - using it is a
  connected-mode decision, incompatible with air-gapped missions
  ([02-hardware-bom.md](02-hardware-bom.md), [03-network-design.md](03-network-design.md)).

## Integrity self-check

The one runnable check this doc leaves behind: on both media drives, `sha256sum -c
CHECKSUMS.sha256` must pass end-to-end, and the versions it covers must match
`MANIFEST.yaml`. If either drive or the version match fails, the media is not mission-ready.

</script>
<script type="text/markdown" data-id="07-containerization" data-title="07 - Containerization (Docker)" data-group="Build" data-file="docs/07-containerization.md">
# 07 - Containerization (Docker / Podman)

An optional deployment style. Instead of installing every Splunk role on its own
bare-metal host, you can run roles as containers. This speeds deployment (pull a known
image, start it) and lets several roles share one physical host, cutting the number of
machines the kit has to carry and power. Bare-metal remains fully supported and is still
the right choice for the heaviest indexers; the two styles mix freely.

This complements [05-splunk-deployment.md](05-splunk-deployment.md) (bare-metal install)
and the colocation rules in [01-architecture.md](01-architecture.md#management-role-colocation).

## Why containers in the kit

- **Faster, repeatable deployment** - a role comes up from a pinned image in seconds, with
  no OS-level install step. The image is the unit you validate at base and carry on the
  offline media.
- **Fewer physical hosts** - run multiple role-containers on one machine. For example, the
  management host can run the **license manager, deployment server, monitoring console**,
  and (on a separate host or the same one within resource limits) the **cluster manager**
  as individual containers, consolidating what would otherwise be two or more laptops.
- **Clean teardown** - stop and remove containers, wipe the mapped data volumes.

## What Splunk supports

- **Official images**: Splunk publishes Dockerfiles and the `splunk/splunk` (Enterprise)
  and `splunk/universalforwarder` images via the **docker-splunk** project on GitHub. They
  are Ansible-driven (Splunk's "splunk-ansible") and configured through environment
  variables / a `default.yml`. Use these rather than rolling your own image.
- **Orchestration**: the **Splunk Operator for Kubernetes** deploys single or distributed
  Splunk Enterprise on Kubernetes. For a flyaway kit, full Kubernetes is usually more than
  you need - plain Docker or Podman with a management UI is lighter. The Operator is noted
  for completeness and for sites that already run k8s.
- **Capacity still applies**: a containerized deployment must provide hardware resources
  that **meet or exceed** the same reference capacity as bare metal. Containers package the
  software; they do not reduce the CPU, RAM, or disk I/O a role needs.

> Reference: Splunk's "Containerized computing platforms" and "Splunk Enterprise and
> containerized infrastructures" in the
> [system requirements](https://help.splunk.com/en/splunk-enterprise/get-started/install-and-upgrade/10.6/plan-your-splunk-enterprise-installation/system-requirements-for-use-of-splunk-enterprise-on-premises).

## Which roles can be containerized

| Role | Container? | Notes |
| --- | --- | --- |
| License manager, deployment server, monitoring console | Yes | Lightweight; good candidates to consolidate on one host |
| Cluster manager | Yes | Still bound by its resource limits; keep it off the same container-set as the DS under load ([01](01-architecture.md#management-role-colocation)) |
| Indexer / indexer cluster peer | Yes | Needs a **persistent, block-based** data volume on fast local NVMe; see [storage](#storage-and-persistence). NOT RECOMMENDED OR SUPPORTED for index clusters on the SAME physical host |
| Search head / ES search head / SH cluster | Yes | Map `etc` and KV store to persistent volumes |
| Heavy forwarder, HEC | Yes | Straightforward |
| SC4S | **Yes - already a container** | SC4S is distributed as a container; this is its normal deployment ([05](05-splunk-deployment.md#sc4s-syslog)) |
| **Splunk SOAR** | **No** | Splunk SOAR (On-premises) **cannot be installed inside a Docker or Podman container** - it runs on bare metal (RHEL-family). See [04](04-os-baseline.md#soar-os-constraints-verified-against-splunk-docs) |

Other roles not listed can also run containerized for their intended purpose; the table
above is the common set. The rule of thumb: **anything except SOAR can be a container**,
and you choose per host whether to run it bare-metal or containerized.

## Colocation with containers

Running two roles as two containers on one physical host is a clean way to colocate - each
role is isolated in its own container, but they share the machine. The **same colocation
cautions from [01-architecture.md](01-architecture.md#management-role-colocation) still
apply at the host level**: the cluster manager and deployment server both have strict
resource limits, and stacking them (even in separate containers) on an overloaded host
will hurt both. Set per-container CPU/memory limits and leave headroom for any indexer on
the same host.

Example consolidation (Small/Medium management host):

```mermaid
flowchart TB
    subgraph host [One physical management host]
        lm[LM container]
        ds[DS container]
        mc[MC container]
        cm[CM container]
    end
    host --- vols[(Persistent volumes on host NVMe)]
```

## Management tools

Manage the containers with whatever the team prefers - the kit is tool-agnostic:

- **Portainer** - web UI for Docker/Podman; good for a quick visual of what's running.
- **Dockhand** - lightweight compose-stack manager.
- **docker compose** / **podman-compose** - declarative stack files, easy to carry and
version.
- **Podman + systemd (Quadlets)** - rootless containers managed as systemd units; aligns
well with the hardening posture in [11-security.md](11-security.md).
- Any other Docker-compatible management tool.

Pick one and standardize so the runbooks are deterministic. A compose file per tier is the
most portable option for an air-gapped kit.

## Storage and persistence

Containers are ephemeral; Splunk data must not be. Map persistent volumes on the host's
fast local NVMe:

- Indexer data (`/opt/splunk/var/lib/splunk`), `etc`, and KV store go on **host NVMe
  volumes**, not inside the container layer.
- **Do not** put hot/warm index buckets on NFS (Splunk supports only cold/frozen on NFS,
  and never shared across a cluster). Use local block storage - exactly what the kit
  desktops provide ([02](02-hardware-bom.md)).
- The volume layout mirrors the bare-metal disk plan in
  [04-os-baseline.md](04-os-baseline.md#disk-layout), so teardown wipe
  ([10](10-runbook-teardown.md#phase-4--secure-wipe)) targets the same NVMe.

## Networking

- Put containers on the kit data VLAN using host networking, a macvlan, or a bridge with
  the [ports matrix](03-network-design.md#splunk-ports-matrix) published. Keep the fixed
  IP/hostname plan ([03](03-network-design.md#ip-and-hostname-plan)) - containers register
  in kit DNS by the same names.
- TLS, cluster `pass4SymmKey`, HEC tokens, and licensing are configured exactly as on bare
  metal ([05](05-splunk-deployment.md), [11](11-security.md)).

## Air-gapped image handling

Containers fit the offline model ([06-offline-repo.md](06-offline-repo.md)):

- At base, pull the pinned `splunk/splunk`, `splunk/universalforwarder`, SC4S, and
  management-tool images, then export them with `docker save` (or `podman save`) to
  tarballs on the offline media.
- Add image names, tags/digests, and checksums to `MANIFEST.yaml` and `CHECKSUMS.sha256`.
- On site, `docker load` / `podman load` from the media - no registry access needed.
- Never pull `:latest` in the field; load the pinned digest you carried.

## When to prefer bare metal

- **Top-end indexers under sustained heavy load**, where squeezing maximum disk I/O and
  CPU matters and you want the fewest layers between Splunk and the NVMe.
- **SOAR** - required ([see above](#which-roles-can-be-containerized)).
- When the team is more comfortable operating bare metal under time pressure - a flyaway
  deployment is not the place to debug an unfamiliar container stack.

## Validation

Same gates as [08-runbook-deploy.md](08-runbook-deploy.md#phase-6--validation): the
containerized instances must appear in the monitoring console, the cluster must report
complete, and a synthetic event must be searchable through each ingest path. A container
that restarts and loses its data volume is a failed persistence setup - verify volumes
survive a `restart` before declaring the kit operational.

> Automation hook (out of scope): a per-tier `compose` file set and an image-load script
> would slot in here, driven by the same `MANIFEST.yaml` that the BOM and offline media use.

</script>
<script type="text/markdown" data-id="08-runbook-deploy" data-title="08 - Runbook: Deploy" data-group="Runbooks" data-file="docs/08-runbook-deploy.md">
# 08 - Runbook: Rapid Deployment

The on-site procedure to go from cases-closed to operational. Assumes hosts were imaged to
the [OS baseline](04-os-baseline.md) at base and the offline media is verified. Work the
steps in order; the order mirrors the Splunk install dependency chain.

## Time target

| Tier | Target (trained 2-person team, pre-imaged hosts) |
|------|--------------------------------------------------|
| Small | ~30-45 min |
| Medium | ~60-90 min |
| Large | ~2-3 hours |

If hosts are **not** pre-imaged, add the OS build time from
[04-os-baseline.md](04-os-baseline.md). Pre-imaging at base is strongly recommended.

## Phase 0 - Physical and power (all tiers)

1. Unpack network + power case first. Place the switch and firewall; connect the PDU to
   the UPS, UPS to mains.
2. Power on the **switch**, then the **firewall**. Confirm switch link lights.
3. Unpack compute. Rack/place indexers (desktops) and lay out laptops.
4. Cable every host to the switch per the VLAN color code
   ([03-network-design.md](03-network-design.md)); label both ends.
5. Power on hosts. Confirm each gets its static IP and is reachable.

## Phase 1 - Network services

1. Bring up `mgmt` services: DNS, DHCP (reserved range only), and NTP (chrony).
2. Verify from another host: `nslookup idx01.kit.local`, `chronyc sources`, time within
   tolerance on all hosts.
3. Verify firewall default-deny is active and the mgmt VLAN can administer switch/fw.

> Do not connect the site VLAN yet. Stand up the kit internally first, then integrate with
> the org network per [13-site-integration.md](13-site-integration.md).

## Phase 2 - Verify offline media

On `mgmt`: `sha256sum -c CHECKSUMS.sha256` passes; versions match `MANIFEST.yaml`
([06-offline-repo.md](06-offline-repo.md)). Confirm license not expired.

## Phase 3 - Splunk core (follow install order)

Per [05-splunk-deployment.md](05-splunk-deployment.md#install-order-all-tiers):

1. **LM** up; license installed; note the `manager_uri`.
2. **CM** up (M/L); cluster secret set; `replication_factor`/`search_factor` set.
3. **Indexers** up; standalone receiving (S) or joined to cluster (M/L). For clusters:
   `splunk apply cluster-bundle` on CM, then `splunk show cluster-status` = complete.
4. **DS** up; serverclasses defined.
5. **Search heads**: ES SH (all), ad-hoc SH (M opt), ES SHC + deployer (L).
6. **MC** up; distributed mode; all instances added as peers; dashboards green.

Checkpoint: every instance points at the LM; cluster is complete; ES SH lists all peers.

## Phase 4 - Ingest

1. Bring up HF/HEC and SC4S ([05](05-splunk-deployment.md#ingest-tier)).
2. Confirm forwarder outputs reach indexers (9997) and HEC answers on 8088.
3. Do **not** open to the site yet - test with a local synthetic event first (Phase 6).

## Phase 5 - SOAR and AI

1. SOAR on its RHEL-family host; connect its Splunk asset to the ES SH; wire ES notables
   to SOAR if the mission uses automation.
2. AI server (optional): deploy the harness + Splunk MCP server per
   ([05](05-splunk-deployment.md#ai-server-optional)); confirm the data posture is allowed
   for a non-local harness ([01](01-architecture.md#ai-server-optional)).

## Phase 6 - Validation

Run before declaring operational. Minimum gate:

```spl
| rest /services/server/info | table splunk_server, version
```

- **Cluster health** (M/L): `splunk show cluster-status` on CM = all peers up, RF/SF met.
- **Peers visible**: on ES SH, Settings > Distributed search shows all indexers up.
- **Ingest per path** - send one synthetic event through each path and confirm it is
  searchable:

```spl
index=* earliest=-5m | stats count by index, sourcetype, host
```

  - Forwarder path: a UF/HF test event appears.
  - HEC: `curl -k https://hf01.kit.local:8088/services/collector -H "Authorization: Splunk <token>" -d '{"event":"kit-hec-test"}'` then search for it.
  - SC4S: send a test syslog line to `sc4s01` and confirm.
- **MC**: all instances green, no missing-peer or replication alerts.
- **Time**: `chronyc tracking` within tolerance on all hosts.
- **ES**: loads; data models targeted at mission indexes populate.

Record pass/fail for each on the arrival checklist
([appendix-checklists.md](appendix-checklists.md#arrival--deployment)).

## Phase 7 - Site integration

Only after Phase 6 passes, connect the site VLAN and begin onboarding the org's data
sources following [13-site-integration.md](13-site-integration.md). Optionally bring up
remote replication ([14-remote-replication-vpn.md](14-remote-replication-vpn.md)).

## If something fails

Go to [09-runbook-operations.md](09-runbook-operations.md) for the common-failure table
and degraded-mode operation. Do not proceed past a failed validation gate; a kit that
silently drops data is worse than a kit that is late.

</script>
